name: Applications FFT curriculum and lab QA
on:
  push:
    paths:
      - 'signals-systems/assets/ss-app-fft-foundations.js'
      - 'signals-systems/assets/ss-app-fft-resolution.js'
      - 'signals-systems/assets/ss-sound-fingerprint.js'
      - 'signals-systems/assets/ss-app-chirp-stft.js'
      - 'signals-systems/assets/ss-fft-upload.js'
      - 'tests/fft-content-invariants.mjs'
      - 'signals-systems/assets/ss-applications-hub.css'
      - 'signals-systems/assets/ss-app-fft-path.js'
      - 'signals-systems/assets/ss-app-fft-path.css'
      - 'signals-systems/applications-fft-*.html'
      - 'signals-systems/applications-chirp-stft.html'
      - 'signals-systems/assets/ss-app-chirp-stft.js'
      - 'signals-systems/assets/ss-dtmf-decoder.js'
      - 'signals-systems/assets/ss-fft-upload.js'
      - 'tests/applications-fft-path-regression.mjs'
      - 'signals-systems/applications-dft-fft.html'
      - 'signals-systems/applications.html'
      - 'signals-systems/assets/ss-applications-hub.js'
      - 'signals-systems/tests/fixtures/dft-fft-vibration-64-160hz.csv'
      - 'tests/applications-dft-fft-regression.mjs'
      - '.github/workflows/applications-dft-fft.yml'
  pull_request:
    paths:
      - 'signals-systems/assets/ss-app-fft-foundations.js'
      - 'signals-systems/assets/ss-app-fft-resolution.js'
      - 'signals-systems/assets/ss-sound-fingerprint.js'
      - 'signals-systems/assets/ss-app-chirp-stft.js'
      - 'signals-systems/assets/ss-fft-upload.js'
      - 'tests/fft-content-invariants.mjs'
      - 'signals-systems/assets/ss-applications-hub.css'
      - 'signals-systems/assets/ss-app-fft-path.js'
      - 'signals-systems/assets/ss-app-fft-path.css'
      - 'signals-systems/applications-fft-*.html'
      - 'signals-systems/applications-chirp-stft.html'
      - 'signals-systems/assets/ss-app-chirp-stft.js'
      - 'signals-systems/assets/ss-dtmf-decoder.js'
      - 'signals-systems/assets/ss-fft-upload.js'
      - 'tests/applications-fft-path-regression.mjs'
      - 'signals-systems/applications-dft-fft.html'
      - 'signals-systems/applications.html'
      - 'signals-systems/assets/ss-applications-hub.js'
      - 'signals-systems/tests/fixtures/dft-fft-vibration-64-160hz.csv'
      - 'tests/applications-dft-fft-regression.mjs'
      - '.github/workflows/applications-dft-fft.yml'
  workflow_dispatch:
jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check mathematical FFT content invariants
        run: node tests/fft-content-invariants.mjs
      - name: Install Playwright
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Run integrated DFT FFT regression
        run: node tests/applications-dft-fft-regression.mjs
      - name: Validate FFT learning progression and navigation
        run: node tests/applications-fft-path-regression.mjs
