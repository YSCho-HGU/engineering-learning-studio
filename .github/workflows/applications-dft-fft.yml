name: Applications FFT curriculum and lab QA
on:
  push:
    paths:
      - 'signals-systems/assets/ss-app-fft-visual-standard.css'
      - 'tests/applications-fft-visual-standard.mjs'
      - 'tests/applications-fft-six-browser-regression.mjs'
      - 'signals-systems/assets/ss-app-fft-butterfly-core.js'
      - 'tests/fft-butterfly-invariants.mjs'
      - 'signals-systems/assets/ss-app-fft-foundations.js'
      - 'signals-systems/assets/ss-app-fft-resolution.js'
      - 'signals-systems/assets/ss-sound-fingerprint.js'
      - 'signals-systems/assets/ss-app-chirp-stft.js'
      - 'signals-systems/assets/ss-fft-upload.js'
      - 'tests/fft-content-invariants.mjs'
      - 'signals-systems/assets/ss-applications-hub.css'
      - 'signals-systems/assets/ss-app-fft-path.js'
      - 'signals-systems/assets/ss-app-fft-path.css'
      - 'signals-systems/applications-fft-*.html'
      - 'signals-systems/applications-chirp-stft.html'
      - 'signals-systems/assets/ss-app-chirp-stft.js'
      - 'signals-systems/assets/ss-dtmf-decoder.js'
      - 'signals-systems/assets/ss-fft-upload.js'
      - 'tests/applications-fft-path-regression.mjs'
      - 'signals-systems/applications-dft-fft.html'
      - 'signals-systems/applications.html'
      - 'signals-systems/assets/ss-applications-hub.js'
      - 'signals-systems/tests/fixtures/dft-fft-vibration-64-160hz.csv'
      - 'tests/applications-dft-fft-regression.mjs'
      - '.github/workflows/applications-dft-fft.yml'
  pull_request:
    paths:
      - 'signals-systems/assets/ss-app-fft-visual-standard.css'
      - 'tests/applications-fft-visual-standard.mjs'
      - 'tests/applications-fft-six-browser-regression.mjs'
      - 'signals-systems/assets/ss-app-fft-butterfly-core.js'
      - 'tests/fft-butterfly-invariants.mjs'
      - 'signals-systems/assets/ss-app-fft-foundations.js'
      - 'signals-systems/assets/ss-app-fft-resolution.js'
      - 'signals-systems/assets/ss-sound-fingerprint.js'
      - 'signals-systems/assets/ss-app-chirp-stft.js'
      - 'signals-systems/assets/ss-fft-upload.js'
      - 'tests/fft-content-invariants.mjs'
      - 'signals-systems/assets/ss-applications-hub.css'
      - 'signals-systems/assets/ss-app-fft-path.js'
      - 'signals-systems/assets/ss-app-fft-path.css'
      - 'signals-systems/applications-fft-*.html'
      - 'signals-systems/applications-chirp-stft.html'
      - 'signals-systems/assets/ss-app-chirp-stft.js'
      - 'signals-systems/assets/ss-dtmf-decoder.js'
      - 'signals-systems/assets/ss-fft-upload.js'
      - 'tests/applications-fft-path-regression.mjs'
      - 'signals-systems/applications-dft-fft.html'
      - 'signals-systems/applications.html'
      - 'signals-systems/assets/ss-applications-hub.js'
      - 'signals-systems/tests/fixtures/dft-fft-vibration-64-160hz.csv'
      - 'tests/applications-dft-fft-regression.mjs'
      - '.github/workflows/applications-dft-fft.yml'
  workflow_dispatch:
concurrency:
  group: fft-browser-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify numeric 8-point FFT butterfly stages
        run: node tests/fft-butterfly-invariants.mjs
      - name: Check mathematical FFT content invariants
        run: node tests/fft-content-invariants.mjs
      - name: Install Korean fonts for visual QA
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y fonts-noto-cjk
      - name: Install Playwright
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Install browser
        run: npx playwright install chromium
      - name: Run integrated DFT FFT regression
        run: node tests/applications-dft-fft-regression.mjs
      - name: Validate FFT learning progression and navigation
        run: node tests/applications-fft-path-regression.mjs
      - name: Verify other six FFT Applications in Chromium
        run: node tests/applications-fft-six-browser-regression.mjs
      - name: Verify shared FFT visual standards across 7 modules
        run: node tests/applications-fft-visual-standard.mjs
      - name: Preserve FFT browser source snapshot for offline visual diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fft-browser-source-snapshot
          path: |
            signals-systems/applications.html
            signals-systems/applications-dft-fft.html
            signals-systems/assets/ss-app-fft-butterfly-core.js
            signals-systems/assets/ss-app-fft-path.js
            signals-systems/assets/ss-app-fft-path.css
            signals-systems/assets/ss-common-header.js
            signals-systems/assets/ss-common-header.css
            signals-systems/assets/ss-readable-themes.css
            signals-systems/assets/ss-applications-hub.js
            signals-systems/assets/ss-applications-hub.css
            signals-systems/tests/fixtures/dft-fft-vibration-64-160hz.csv
            assets/els-language.js
            assets/els-theme-v2.js
            assets/els-theme-v2.css
            assets/els-typography-standard.css
            tests/applications-dft-fft-regression.mjs
          if-no-files-found: error
          retention-days: 7
      - name: Archive 7 FFT visual QA views and computed layout measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fft-seven-visual-standard-screenshots
          path: artifacts/fft-visual-standard-qa/*
          if-no-files-found: warn
          retention-days: 14
      - name: Capture six FFT lessons (desktop, light/dark and mobile)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fft-six-lessons-browser-screenshots
          path: artifacts/fft-six-browser-qa/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Attach Chromium screenshots and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fft-butterfly-browser-screenshots
          path: artifacts/fft-browser-qa/*.png
          if-no-files-found: warn
          retention-days: 14
