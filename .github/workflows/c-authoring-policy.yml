name: C Chapter Authoring Standard
on:
  push:
    paths:
      - 'c-programming/**/data.js'
      - 'c-programming/course-catalog.json'
      - 'c-programming/course-catalog.js'
      - 'textbook-viewer/**'
      - 'tests/textbook-viewer.mjs'
      - 'c-programming/journey.js'
      - 'tests/c-authoring-policy.mjs'
      - 'tests/c-course-gcc.mjs'
      - 'tests/c-advanced-review.mjs'
      - 'c-programming/file-io/**'
      - 'c-programming/language.js'
      - 'tests/c-fileio-ui.mjs'
      - 'c-programming/file-io/practice/**'
      - 'tests/c-fileio-mini-lab.mjs'
      - 'c-programming/practice-engine.js'
      - 'docs/C_PROGRAMMING_AUTHORING_STANDARD.md'
      - '.github/workflows/c-authoring-policy.yml'
  workflow_dispatch:
jobs:
  authoring-and-c11:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check flexible C chapter data and lesson quality
        run: node tests/c-authoring-policy.mjs
      - name: Verify 151-181 Core/Optional curriculum consistency
        run: node tests/c-advanced-review.mjs
      - name: Test required File I/O fgets and fputs mini lab
        run: node tests/c-fileio-mini-lab.mjs
      - name: Validate File I/O UI titles, language, source and progress compatibility
        run: node tests/c-fileio-ui.mjs
      - name: Verify Textbook Viewer and course link regressions
        run: node tests/textbook-viewer.mjs
      - name: GCC C11 verify published lesson reference programs
        run: node tests/c-course-gcc.mjs
