name: C File I/O M1 Buffer Explorer QA
on:
  push:
    paths:
      - 'c-programming/file-io/practice/**'
      - 'tests/c-fileio-buffer-browser.mjs'
      - '.github/workflows/c-fileio-buffer-browser.yml'
  workflow_dispatch:
concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  buffer-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/els-qa-http.log 2>&1 &
          sleep 2
      - name: Verify File I/O buffer explorer
        run: node tests/c-fileio-buffer-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fileio-buffer-screenshots
          path: qa-fileio-buffer-*.png
          retention-days: 7
