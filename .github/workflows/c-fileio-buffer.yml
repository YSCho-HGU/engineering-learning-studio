name: C File I/O M1 Buffer Explorer QA
on:
  push:
    paths:
      - 'c-programming/file-io/practice/**'
      - 'tests/c-fileio-buffer-browser.mjs'
      - '.github/workflows/c-fileio-buffer.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8765 --bind 127.0.0.1 &
      - run: node tests/c-fileio-buffer-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fileio-m1-buffer-screenshots
          path: qa-fileio-buffer-*.png
          retention-days: 7
