name: C File I/O Core Explorers QA
on:
  push:
    paths:
      - 'c-programming/file-io/practice/**'
      - 'c-programming/file-io/index.html'
      - 'c-programming/file-io/app.js'
      - 'c-programming/file-io/ux-review.css'
      - 'tests/c-fileio-buffer-browser.mjs'
      - 'tests/c-fileio-core-browser.mjs'
      - 'tests/c-fileio-ux-browser.mjs'
      - '.github/workflows/c-fileio-buffer.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8765 --bind 127.0.0.1 &
      - run: node tests/c-fileio-buffer-browser.mjs
      - run: node tests/c-fileio-core-browser.mjs
      - run: node tests/c-fileio-ux-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fileio-core-visual-qa
          path: |
            qa-fileio-buffer-*.png
            qa-fileio-core-*.png
            qa-fileio-ux-*.png
          retention-days: 7
