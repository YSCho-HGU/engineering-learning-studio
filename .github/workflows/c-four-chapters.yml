name: C Programming Authoring and Chapter QA
on:
  push:
    paths:
      - 'c-programming/arrays/**'
      - 'c-programming/strings/**'
      - 'c-programming/standard-library/**'
      - 'c-programming/functions/**'
      - 'c-programming/journey.js'
      - 'c-programming/practice-engine.js'
      - 'c-programming/course-catalog.json'
      - 'tests/c-four-chapters.mjs'
      - 'tests/c-authoring-policy.mjs'
      - 'tests/c-course-gcc.mjs'
      - 'c-programming/_template/**'
      - 'docs/C_PROGRAMMING_AUTHORING_STANDARD.md'
      - 'tests/c-site-integrity.mjs'
      - 'tests/c-four-chapters-browser.mjs'
      - '.github/workflows/c-four-chapters.yml'
  workflow_dispatch:
jobs:
  gcc-c11-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify chapter structure and all common-engine GCC C11 examples
        run: |
          node tests/c-site-integrity.mjs
          node tests/c-authoring-policy.mjs
          node tests/c-course-gcc.mjs

  browser-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 8765 --bind 127.0.0.1 &
      - name: Run chapter learning UI regression
        run: node tests/c-four-chapters-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: four-chapter-visual-qa
          path: qa-c-*.png
          retention-days: 7
