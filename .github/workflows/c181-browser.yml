name: C Chapter 181 Browser QA
on:
  push:
    paths:
      - 'c-programming/index.html'
      - 'c-programming/course-catalog.js'
      - 'c-programming/course-catalog.json'
      - 'c-programming/admin/**'
      - 'c-programming/dynamic-memory/**'
      - 'c-programming/journey.js'
      - 'c-programming/practice-engine.js'
      - 'tests/c181-browser.mjs'
      - '.github/workflows/c181-browser.yml'
  workflow_dispatch:
concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Serve
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/els-qa-http.log 2>&1 &
          sleep 2
      - name: Test Chapter 181 and course cards
        run: node tests/c181-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c181-browser-screenshots
          path: qa-*.png
          retention-days: 7
