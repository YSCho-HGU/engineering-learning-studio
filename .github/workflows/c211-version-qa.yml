name: C 211 Build Journey QA
on:
  push:
    paths:
      - 'c-programming/ai-coding/**'
      - 'tests/c211-*.mjs'
      - '.github/workflows/c211-version-qa.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/c211-version-static.mjs
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8765 --bind 127.0.0.1 &
      - run: node tests/c211-toc-browser.mjs
      - run: node tests/c211-version-browser.mjs
      - run: node tests/c211-experience-browser.mjs
      - run: node tests/c211-release-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c211-release-screenshots
          path: qa-c211-release/
          if-no-files-found: warn
