        if: ${{ failure() || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence-${{ github.job }}-${{ github.run_id }}
          path: |
            qa/
            qa-output/
            qa-*.png
            artifacts/
            tests/screenshots/
          if-no-files-found: ignore
          retention-days: 7
