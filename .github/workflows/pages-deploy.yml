name: Studio Pages - production
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '404.html'
      - '.nojekyll'
      - 'assets/**'
      - 'shared/**'
      - 'c-programming/**'
      - 'signals-systems/**'
      - 'admin/**'
      - 'progress/**'
      - 'textbook-viewer/**'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: studio-pages-production
  cancel-in-progress: false

jobs:
  publish:
    name: Publish static Studio (independent from browser QA)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Minimal checks for critical site entrypoints
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s c-programming/index.html
          test -s signals-systems/index.html
          test -s c-programming/pointer/index.html
          test -s signals-systems/applications.html
          test -s assets/els-course-header.css
          test -s assets/els-header-controls.js
          node --check assets/els-header-controls.js
          node --check c-programming/c-ss-shell.js
          node --check signals-systems/assets/ss-common-header.js

      - name: Stage public files and embed the exact commit
        shell: bash
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/studio-site"
          mkdir -p "$site"
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='qa/header-preflight/' \
            --exclude='tests/' \
            ./ "$site/"
          printf '{"commit":"%s","header":"v10-c-single-language","builtAt":"%s"}\n' \
            "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$site/build-info.json"
          test -s "$site/build-info.json"
          test -s "$site/index.html"
          echo "Publishing commit $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload public site only
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/studio-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record production deployment identity
        shell: bash
        run: |
          echo "Deployment URL: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Expected build-info.json commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Browser QA runs independently in Studio Pages - postdeploy QA." >> "$GITHUB_STEP_SUMMARY"
