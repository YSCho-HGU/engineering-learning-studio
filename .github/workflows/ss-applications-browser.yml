name: Signals & Systems Applications browser smoke
on:
  push:
    paths:
      - 'signals-systems/applications*.html'
      - 'signals-systems/assets/ss-app-*.js'
      - 'signals-systems/assets/ss-app-*.css'
      - 'signals-systems/assets/ss-applications-hub.js'
      - 'signals-systems/assets/ss-common-header.js'
      - 'tests/ss-applications-browser.mjs'
      - '.github/workflows/ss-applications-browser.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check signals-systems/assets/ss-app-labs.js
          node --check signals-systems/assets/ss-applications-hub.js
          node --check tests/ss-applications-browser.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Start local static site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ss-applications-server.log 2>&1 &
          sleep 2
      - name: Check desktop, mobile, controls, plots, language and theme
        run: node tests/ss-applications-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ss-part-a-visual-snapshots
          path: tests/screenshots/
          if-no-files-found: ignore
