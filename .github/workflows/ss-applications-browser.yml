name: Signals & Systems Applications browser smoke
on:
  push:
    paths:
      - 'signals-systems/applications*.html'
      - 'signals-systems/assets/ss-app-*.js'
      - 'signals-systems/assets/ss-app-*.css'
      - 'signals-systems/assets/ss-applications-hub.js'
      - 'signals-systems/assets/ss-applications-hub.css'
      - 'signals-systems/assets/ss-applications-math.js'
      - 'signals-systems/assets/ss-applications-math.css'
      - 'signals-systems/assets/ss-math-core.js'
      - 'signals-systems/assets/ss-app-fft-foundations.js'
      - 'signals-systems/assets/ss-app-fft-foundations.css'
      - 'signals-systems/assets/ss-fft-lab-standard.css'
      - 'tests/ss-applications-math-audit.mjs'
      - 'tests/ss-fft-foundations-browser.mjs'
      - 'tests/ss-chirp-stft-browser.mjs'
      - 'tests/ss-fft-upload-browser.mjs'
      - 'tests/ss-dtmf-decoder-browser.mjs'
      - 'tests/ss-sound-fingerprint-browser.mjs'
      - 'signals-systems/assets/ss-sound-fingerprint.js'
      - 'signals-systems/assets/ss-sound-fingerprint.css'
      - 'signals-systems/assets/ss-dtmf-decoder.js'
      - 'signals-systems/assets/ss-fft-dtmf.css'
      - 'signals-systems/assets/ss-fft-upload.js'
      - 'signals-systems/assets/ss-fft-harmonics.js'
      - 'signals-systems/assets/ss-fft-upload.css'
      - 'signals-systems/assets/ss-app-extra-labs.js'
      - 'tests/ss-extra-labs-browser.mjs'
      - 'signals-systems/assets/ss-common-header.js'
      - 'tests/ss-applications-browser.mjs'
      - 'tests/ss-partb-system-browser.mjs'
      - 'signals-systems/assets/ss-system-lab-core.js'
      - 'signals-systems/tests/partb-system-labs.mjs'
      - '.github/workflows/ss-applications-browser.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check signals-systems/assets/ss-app-labs.js
          node --check signals-systems/assets/ss-applications-hub.js
          node --check signals-systems/assets/ss-applications-math.js
          node --check signals-systems/assets/ss-app-fft-foundations.js
          node --check signals-systems/assets/ss-app-fft-resolution.js
          node --check signals-systems/assets/ss-app-chirp-stft.js
          node --check tests/ss-chirp-stft-browser.mjs
          node --check signals-systems/assets/ss-fft-harmonics.js
          node --check signals-systems/assets/ss-fft-upload.js
          node --check tests/ss-fft-upload-browser.mjs
          node --check signals-systems/assets/ss-dtmf-decoder.js
          node --check tests/ss-dtmf-decoder-browser.mjs
          node --check signals-systems/assets/ss-sound-fingerprint.js
          node --check tests/ss-sound-fingerprint-browser.mjs
          node --check tests/ss-fft-foundations-browser.mjs
          node --check signals-systems/assets/ss-app-extra-labs.js
          node --check tests/ss-extra-labs-browser.mjs
          node --check tests/ss-applications-browser.mjs
          node --check signals-systems/assets/ss-app-system-labs.js
          node --check signals-systems/assets/ss-app-system-explorers.js
          node --check signals-systems/assets/ss-system-lab-core.js
          node --check tests/ss-partb-system-browser.mjs
          node signals-systems/tests/partb-system-labs.mjs
          node --check tests/ss-applications-math-audit.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Start local static site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ss-applications-server.log 2>&1 &
          sleep 2
      - name: Check RC circuit and moving-average walkthrough interactions
        id: partb
        continue-on-error: true
        run: node tests/ss-partb-system-browser.mjs
      - name: Check original Harmonics, Chirp and Helix labs
        id: primary
        continue-on-error: true
        run: node tests/ss-applications-browser.mjs
      - name: Check Beats, AM/FM and Sampling aliasing labs
        id: extra
        continue-on-error: true
        run: node tests/ss-extra-labs-browser.mjs
      - name: Check FFT labs, graph missions, KaTeX and responsive layout
        id: fft
        continue-on-error: true
        run: node tests/ss-fft-foundations-browser.mjs
      - name: Check Chirp FFT STFT and Spectrogram calculations and interaction
        id: stft
        continue-on-error: true
        run: node tests/ss-chirp-stft-browser.mjs
      - name: Check real audio and sensor FFT upload lab
        id: realfft
        continue-on-error: true
        run: node tests/ss-fft-upload-browser.mjs
      - name: Check DTMF mystery FFT decoding and challenge learning
        id: dtmf
        continue-on-error: true
        run: node tests/ss-dtmf-decoder-browser.mjs
      - name: Check Sound Fingerprint listening, FFT and harmonic discovery
        id: fingerprint
        continue-on-error: true
        run: node tests/ss-sound-fingerprint-browser.mjs
      - name: Check mathematical notation across all Applications and language modes
        id: math
        continue-on-error: true
        run: node tests/ss-applications-math-audit.mjs
      - name: Publish machine-readable FFT browser QA status
        if: always()
        env:
          FFT_OUTCOME: ${{ steps.fft.outcome }}
          FFT_RESULT: ${{ steps.fft.conclusion }}
          PRIMARY_RESULT: ${{ steps.primary.outcome }}
          EXTRA_RESULT: ${{ steps.extra.outcome }}
          MATH_RESULT: ${{ steps.math.outcome }}
          STFT_RESULT: ${{ steps.stft.outcome }}
          REALFFT_RESULT: ${{ steps.realfft.outcome }}
          DTMF_RESULT: ${{ steps.dtmf.outcome }}
          FINGERPRINT_RESULT: ${{ steps.fingerprint.outcome }}
          PARTB_RESULT: ${{ steps.partb.outcome }}
        run: |
          mkdir -p qa
          python3 - <<'PY'
          import json,os,datetime
          result={
            "source_sha":os.environ["GITHUB_SHA"],
            "workflow":"ss-applications-browser",
            "tested_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "fft_browser_outcome":os.environ["FFT_RESULT"],
            "original_labs_outcome":os.environ["PRIMARY_RESULT"],
            "additional_labs_outcome":os.environ["EXTRA_RESULT"],
            "applications_math_outcome":os.environ["MATH_RESULT"],
            "chirp_stft_outcome":os.environ["STFT_RESULT"],
            "real_fft_upload_outcome":os.environ["REALFFT_RESULT"],
            "dtmf_mystery_outcome":os.environ["DTMF_RESULT"],
            "sound_fingerprint_outcome":os.environ["FINGERPRINT_RESULT"],
            "partb_system_browser_outcome":os.environ["PARTB_RESULT"],
            "viewport_widths":[1366,390],
            "coverage":["FFT arithmetic","graph missions","KaTeX","language modes","five themes","responsive overflow"]
          }
          with open("qa/fft-browser-last-run.json","w") as f:
            json.dump(result,f,indent=2)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/fft-browser-last-run.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(qa): publish FFT browser test status [skip ci]"
            git push origin HEAD:main || echo "QA status push unavailable"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ss-part-a-visual-snapshots
          path: |
            tests/screenshots/
            qa/applications-math-audit.json
          if-no-files-found: ignore
      - name: Enforce combined browser QA result
        if: always()
        env:
          PRIMARY: ${{ steps.primary.outcome }}
          EXTRA: ${{ steps.extra.outcome }}
          FFT: ${{ steps.fft.outcome }}
          MATH: ${{ steps.math.outcome }}
          STFT: ${{ steps.stft.outcome }}
          REALFFT: ${{ steps.realfft.outcome }}
          DTMF: ${{ steps.dtmf.outcome }}
          FINGERPRINT: ${{ steps.fingerprint.outcome }}
          PARTB: ${{ steps.partb.outcome }}
        run: |
          echo "original=$PRIMARY extra=$EXTRA fft=$FFT stft=$STFT realfft=$REALFFT dtmf=$DTMF fingerprint=$FINGERPRINT math=$MATH partb=$PARTB"
          test "$PRIMARY" = success && test "$EXTRA" = success && test "$FFT" = success && test "$STFT" = success && test "$REALFFT" = success && test "$DTMF" = success && test "$FINGERPRINT" = success && test "$MATH" = success && test "$PARTB" = success
