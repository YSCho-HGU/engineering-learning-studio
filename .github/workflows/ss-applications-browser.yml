name: Signals & Systems Applications browser smoke
on:
  push:
    paths:
      - 'signals-systems/applications*.html'
      - 'signals-systems/assets/ss-app-*.js'
      - 'signals-systems/assets/ss-app-*.css'
      - 'signals-systems/assets/ss-applications-hub.js'
      - 'signals-systems/assets/ss-applications-hub.css'
      - 'signals-systems/assets/ss-applications-math.js'
      - 'signals-systems/assets/ss-applications-math.css'
      - 'signals-systems/assets/ss-math-core.js'
      - 'signals-systems/assets/ss-app-fft-foundations.js'
      - 'signals-systems/assets/ss-app-fft-foundations.css'
      - 'signals-systems/assets/ss-fft-lab-standard.css'
      - 'tests/ss-applications-math-audit.mjs'
      - 'tests/ss-fft-foundations-browser.mjs'
      - 'signals-systems/assets/ss-app-extra-labs.js'
      - 'tests/ss-extra-labs-browser.mjs'
      - 'signals-systems/assets/ss-common-header.js'
      - 'tests/ss-applications-browser.mjs'
      - '.github/workflows/ss-applications-browser.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check signals-systems/assets/ss-app-labs.js
          node --check signals-systems/assets/ss-applications-hub.js
          node --check signals-systems/assets/ss-applications-math.js
          node --check signals-systems/assets/ss-app-fft-foundations.js
          node --check signals-systems/assets/ss-app-fft-resolution.js
          node --check tests/ss-fft-foundations-browser.mjs
          node --check signals-systems/assets/ss-app-extra-labs.js
          node --check tests/ss-extra-labs-browser.mjs
          node --check tests/ss-applications-browser.mjs
          node --check tests/ss-applications-math-audit.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Start local static site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ss-applications-server.log 2>&1 &
          sleep 2
      - name: Check original Harmonics, Chirp and Helix labs
        id: primary
        continue-on-error: true
        run: node tests/ss-applications-browser.mjs
      - name: Check Beats, AM/FM and Sampling aliasing labs
        id: extra
        continue-on-error: true
        run: node tests/ss-extra-labs-browser.mjs
      - name: Check FFT labs, graph missions, KaTeX and responsive layout
        id: fft
        continue-on-error: true
        run: node tests/ss-fft-foundations-browser.mjs
      - name: Check mathematical notation across all Applications and language modes
        id: math
        continue-on-error: true
        run: node tests/ss-applications-math-audit.mjs
      - name: Publish machine-readable FFT browser QA status
        if: always()
        env:
          FFT_OUTCOME: ${{ steps.fft.outcome }}
          FFT_RESULT: ${{ steps.fft.conclusion }}
          PRIMARY_RESULT: ${{ steps.primary.outcome }}
          EXTRA_RESULT: ${{ steps.extra.outcome }}
          MATH_RESULT: ${{ steps.math.outcome }}
        run: |
          mkdir -p qa
          python3 - <<'PY'
          import json,os,datetime
          result={
            "source_sha":os.environ["GITHUB_SHA"],
            "workflow":"ss-applications-browser",
            "tested_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "fft_browser_outcome":os.environ["FFT_RESULT"],
            "original_labs_outcome":os.environ["PRIMARY_RESULT"],
            "additional_labs_outcome":os.environ["EXTRA_RESULT"],
            "applications_math_outcome":os.environ["MATH_RESULT"],
            "viewport_widths":[1366,390],
            "coverage":["FFT arithmetic","graph missions","KaTeX","language modes","five themes","responsive overflow"]
          }
          with open("qa/fft-browser-last-run.json","w") as f:
            json.dump(result,f,indent=2)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/fft-browser-last-run.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(qa): publish FFT browser test status [skip ci]"
            git push origin HEAD:main || echo "QA status push unavailable"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ss-part-a-visual-snapshots
          path: |
            tests/screenshots/
            qa/applications-math-audit.json
          if-no-files-found: ignore
      - name: Enforce combined browser QA result
        if: always()
        env:
          PRIMARY: ${{ steps.primary.outcome }}
          EXTRA: ${{ steps.extra.outcome }}
          FFT: ${{ steps.fft.outcome }}
          MATH: ${{ steps.math.outcome }}
        run: |
          echo "original=$PRIMARY extra=$EXTRA fft=$FFT math=$MATH"
          test "$PRIMARY" = success && test "$EXTRA" = success && test "$FFT" = success && test "$MATH" = success
