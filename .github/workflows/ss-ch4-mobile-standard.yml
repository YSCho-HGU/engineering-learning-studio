name: SS Chapter 4 mobile design regression (Ch 1–8)
on:
  push:
    branches: [main]
    paths:
      - 'signals-systems/chapter[1-8].html'
      - 'signals-systems/assets/ss-mobile-ch4-standard.css'
      - 'signals-systems/assets/ss-mobile-ch4-standard.js'
      - 'signals-systems/assets/ss-responsive-unified.css'
      - 'signals-systems/assets/ss-sidebar-layout.css'
      - 'signals-systems/assets/ss-sidebar-toggle.js'
      - 'signals-systems/assets/ss-common-header.css'
      - 'signals-systems/assets/ss-common-header.js'
      - 'signals-systems/assets/ss-foundations-standard.css'
      - 'signals-systems/assets/ss-chapter5-layout-standard.css'
      - 'signals-systems/assets/ss-chapter5-internal-rhythm.css'
      - 'signals-systems/assets/ss-ch5-standalone.css'
      - 'signals-systems/assets/ss-ch6-standalone.css'
      - 'signals-systems/assets/ss-ch7-standalone.css'
      - 'signals-systems/assets/ss-ch8-native.css'
      - 'signals-systems/assets/ss-ui-standard.css'
      - 'signals-systems/assets/ss-graph-workspace-layout.css'
      - 'signals-systems/assets/ss-four-step-standard.css'
      - 'signals-systems/assets/ss-formula-standard.css'
      - 'assets/els-theme-v2.css'
      - 'assets/els-theme-v2.js'
      - 'assets/els-language.js'
      - 'tests/ss-ch4-mobile-standard-browser.mjs'
      - '.github/workflows/ss-ch4-mobile-standard.yml'
  pull_request:
    paths:
      - 'signals-systems/chapter[1-8].html'
      - 'signals-systems/assets/**'
      - 'assets/els-theme-v2.css'
      - 'assets/els-theme-v2.js'
      - 'assets/els-language.js'
      - 'tests/ss-ch4-mobile-standard-browser.mjs'
      - '.github/workflows/ss-ch4-mobile-standard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chapter4-mobile-ux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test
          npx playwright install chromium
      - name: Check responsive geometry controller syntax
        run: |
          node --check signals-systems/assets/ss-mobile-ch4-standard.js
          node --check tests/ss-ch4-mobile-standard-browser.mjs
      - name: Start standalone Studio server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ss-mobile-ch4.log 2>&1 &
          sleep 2
      - name: Compare every chapter with Chapter 4 on mobile and tablet
        run: node tests/ss-ch4-mobile-standard-browser.mjs
      - name: Upload chapter-by-chapter screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ss-ch4-mobile-ux-report
          path: qa/ss-ch4-mobile-standard/
          retention-days: 14
          if-no-files-found: ignore
