name: Signals Systems Chapters 1-8 math audit
on:
  push:
    paths:
      - 'signals-systems/chapter[1-8].html'
      - 'signals-systems/assets/ss-chapters-math-audit.js'
      - 'signals-systems/assets/ss-math-core.js'
      - 'signals-systems/assets/ss-common-header.css'
      - 'signals-systems/assets/ss-foundations-standard.css'
      - 'signals-systems/assets/ss-formula-standard.css'
      - 'signals-systems/assets/ss-ch7-standalone.css'
      - 'signals-systems/assets/ss-responsive-unified.css'
      - 'signals-systems/assets/ss-presentation-mode.js'
      - 'signals-systems/assets/ss-presentation-mode.css'
      - 'signals-systems/assets/ss-plot-typography.css'
      - 'signals-systems/assets/ss-canvas-typography.js'
      - 'signals-systems/assets/ss-graph-math.js'
      - 'tests/ss-plot-typography-browser.mjs'
      - 'signals-systems/assets/ss-app-labs.js'
      - 'signals-systems/applications*.html'
      - 'tests/ss-responsive-unified-browser.mjs'
      - 'signals-systems/assets/ss-ch*-math.js'
      - 'signals-systems/assets/ss-ch*-prose-math.js'
      - 'signals-systems/assets/ss-foundations-standard.js'
      - 'tests/ss-chapters-math-audit.mjs'
      - 'tests/ss-chapters-full-qa.mjs'
      - '.github/workflows/ss-chapters-math-audit.yml'
  workflow_dispatch:
concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chapters-math:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify auditor syntax
        run: |
          node --check signals-systems/assets/ss-chapters-math-audit.js
          node --check signals-systems/assets/ss-canvas-typography.js
          node --check tests/ss-plot-typography-browser.mjs
          node --check tests/ss-chapters-math-audit.mjs
          node --check tests/ss-chapters-full-qa.mjs
          node --check tests/ss-responsive-unified-browser.mjs
      - name: Install Chromium
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Start local static site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ss-chapters-server.log 2>&1 &
          sleep 2
      - name: Audit chapter math in three language modes
        run: node tests/ss-chapters-math-audit.mjs
      - name: Full section navigation, math, graph, language and theme QA
        run: node tests/ss-chapters-full-qa.mjs
      - name: Responsive lecture tablet and phone QA
        run: node tests/ss-responsive-unified-browser.mjs
      - name: Canvas and SVG typography precision audit
        run: node tests/ss-plot-typography-browser.mjs
      - name: Upload detailed math audit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ss-chapters-math-audit
          path: |
            qa/chapters-math-audit.json
            qa/chapters-full-qa.json
            qa/ss-responsive-unified-results.json
            qa/responsive-screenshots/
            qa/ss-plot-typography-audit.json
            qa/plot-typography-screenshots/
          if-no-files-found: ignore
