name: Signals & Systems Part C FFT study paths

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ss-fft-study-path-qa.yml'
      - 'signals-systems/applications.html'
      - 'signals-systems/applications-fft-theory.html'
      - 'signals-systems/applications-fft-lab.html'
      - 'signals-systems/applications-fft-resolution.html'
      - 'signals-systems/applications-dft-fft.html'
      - 'signals-systems/applications-fft-dtmf.html'
      - 'signals-systems/applications-fft-sound-fingerprint.html'
      - 'signals-systems/applications-fft-upload.html'
      - 'signals-systems/applications-fft-image.html'
      - 'signals-systems/assets/ss-fft-study-path.js'
      - 'signals-systems/assets/ss-fft-study-path.css'
      - 'signals-systems/assets/ss-fft-theory-guide.js'
      - 'signals-systems/assets/ss-fft-theory-guide.css'
      - 'tests/ss-fft-learning-contract.mjs'
      - 'tests/ss-fft-learning-browser.mjs'

permissions:
  contents: read

jobs:
  content:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify 7 FFT lessons, theoretical background and numerical examples
        run: node tests/ss-fft-learning-contract.mjs

  chromium:
    runs-on: ubuntu-latest
    needs: content
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser QA dependencies
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test
          npx playwright install --with-deps chromium
      - name: Run 48 desktop/mobile × bilingual/single-language cases
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/ss-fft-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 1
          node tests/ss-fft-learning-browser.mjs
      - name: Preserve report and failed-case screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ss-part-c-fft-study-path-browser-qa
          path: tests/screenshots/fft-learning/
          if-no-files-found: warn
          retention-days: 14
