name: Signals header language and theme order
on:
  push:
    branches: [main]
    paths:
      - 'signals-systems/index.html'
      - 'signals-systems/chapter*.html'
      - 'signals-systems/assets/ss-sidebar-layout.css'
      - 'signals-systems/assets/ss-common-header.css'
      - 'signals-systems/assets/ss-common-header.js'
      - 'assets/els-theme-v2.js'
      - 'signals-systems/assets/els-theme-v2.js'
      - 'tests/ss-header-language-theme-e2e.mjs'
      - 'tests/ss-sidebar-ch4-standard-e2e.mjs'
      - '.github/workflows/ss-header-language-theme.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  header-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Inspect Overview, Learning Map and Chapter
        run: node tests/ss-header-language-theme-e2e.mjs
      - name: Verify Chapter 4 sidebar visual standard in all 8 chapters
        run: node tests/ss-sidebar-ch4-standard-e2e.mjs
