name: 2D Image FFT Discovery - mathematical and browser QA
on:
  push:
    paths:
      - 'signals-systems/assets/ss-image-fft-core.js'
      - 'signals-systems/assets/ss-image-fft.js'
      - 'signals-systems/assets/ss-image-fft-pipeline.js'
      - 'signals-systems/assets/ss-image-fft.css'
      - 'signals-systems/applications-fft-image.html'
      - 'signals-systems/assets/ss-applications-hub.js'
      - 'signals-systems/assets/ss-app-fft-path.js'
      - 'tests/image-fft-core-invariants.mjs'
      - 'tests/image-fft-browser.mjs'
      - '.github/workflows/ss-image-fft.yml'
  workflow_dispatch:
jobs:
  image-fft:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check signals-systems/assets/ss-image-fft-core.js
          node --check signals-systems/assets/ss-image-fft.js
          node --check signals-systems/assets/ss-image-fft-pipeline.js
          node --check tests/image-fft-core-invariants.mjs
          node --check tests/image-fft-browser.mjs
      - name: Verify 2D FFT numerical identities, kernels, symmetric notches and IFFT
        run: node tests/image-fft-core-invariants.mjs
      - name: Install Chromium for desktop and mobile tests
        run: |
          npm install --no-save --no-audit --no-fund @playwright/test
          npx playwright install chromium
      - name: Start local site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ss-image-fft-http.log 2>&1 &
          sleep 2
      - name: Test 4-stage student journeys, kernel inquiry, upload, theme and language
        run: node tests/image-fft-browser.mjs
      - name: Keep rendered screenshots for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-fft-discovery-student-screenshots
          path: tests/screenshots/image-fft/*
          retention-days: 14
          if-no-files-found: ignore
