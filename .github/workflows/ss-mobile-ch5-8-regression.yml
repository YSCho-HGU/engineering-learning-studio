name: SS Chapter 5-8 mobile regression
on:
  push:
    paths:
      - 'signals-systems/chapter5.html'
      - 'signals-systems/chapter6.html'
      - 'signals-systems/chapter7.html'
      - 'signals-systems/chapter8.html'
      - 'signals-systems/assets/ss-ch5-standalone.css'
      - 'signals-systems/assets/ss-ui-standard.css'
      - 'signals-systems/assets/ss-mobile-ch5-8-repair.css'
      - 'signals-systems/assets/ss-mobile-ch5-8-repair.js'
      - 'tests/ss-mobile-ch5-8-regression.mjs'
      - '.github/workflows/ss-mobile-ch5-8-regression.yml'
  workflow_dispatch:
jobs:
  responsive:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock @playwright/test
          npx playwright install chromium
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ss-mobile.log 2>&1 &
          sleep 2
      - name: Run Chapter 5-8 390/430/768px expanded and persisted-collapsed scenarios
        run: node tests/ss-mobile-ch5-8-regression.mjs
      - name: Upload viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ss-mobile-ch5-8-screenshots
          path: qa/ss-mobile-ch5-8/
          retention-days: 14
          if-no-files-found: ignore
