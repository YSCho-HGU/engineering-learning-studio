name: Integrated Studio Admin QA
on:
  push:
    paths:
      - 'index.html'
      - 'admin/**'
      - 'c-programming/admin/**'
      - 'c-programming/course-catalog.*'
      - 'tests/studio-admin.mjs'
      - 'tests/studio-admin-github.mjs'
      - 'github-owner-worker/**'
      - '.github/workflows/studio-admin.yml'
  workflow_dispatch:
concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8765 --bind 127.0.0.1 &
      - name: Test single-owner identity, catalogs and Worker OAuth flow
        run: node --test github-owner-worker/tests/*.test.mjs
      - name: Validate admin and Worker JavaScript syntax
        run: |
          node --check admin/admin.js
          node --check admin/admin-access.js
          node --check admin/github-owner.js
          node --check github-owner-worker/src/index.js
          node --check github-owner-worker/src/catalog-core.js
          node --check tests/studio-admin-github.mjs
      - name: Verify fail-closed admin gate and retired C admin entry
        run: node tests/studio-admin.mjs
      - name: Validate GitHub Owner sign-in and protected Worker API mode
        run: node tests/studio-admin-github.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-admin-qa
          path: |
            qa-studio-admin.png
            qa-studio-admin-github.png
          retention-days: 7
