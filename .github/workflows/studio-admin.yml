name: Integrated Studio Admin QA
on:
  push:
    paths:
      - 'admin/**'
      - 'c-programming/admin/**'
      - 'c-programming/course-catalog.*'
      - 'tests/studio-admin.mjs'
      - '.github/workflows/studio-admin.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8765 --bind 127.0.0.1 &
      - run: node tests/studio-admin.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-admin-qa
          path: qa-studio-admin.png
          retention-days: 7
