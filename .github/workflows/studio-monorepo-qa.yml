name: Studio monorepo migration contract
on:
  pull_request:
    paths:
      - 'signals-systems/**'
      - 'shared/**'
      - 'c-programming/**'
      - 'assets/**'
      - 'index.html'
      - 'tests/studio-monorepo-contract.mjs'
      - '.github/workflows/studio-monorepo-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Studio migration and localization contracts
        run: node tests/studio-monorepo-contract.mjs
      - name: C site integrity
        run: node tests/c-site-integrity.mjs
      - name: Signals content language contract
        working-directory: signals-systems
        run: node tests/ss-data-language-contract.mjs
  migration-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Eight C course browser regression
        id: c_browser
        continue-on-error: true
        run: node tests/qa-unified-browser.mjs
      - name: Start Studio root server
        run: |
          python3 -m http.server 8788 --bind 127.0.0.1 >/tmp/studio-preview.log 2>&1 &
          sleep 2
      - name: Shared cross-course language, theme and progress regression
        id: shared_state
        continue-on-error: true
        run: node tests/studio-cross-course-state-e2e.mjs
      - name: Signals chapter navigation and theme regression
        id: ss_nav
        continue-on-error: true
        working-directory: signals-systems
        env:
          SS_BASE_URL: http://127.0.0.1:8788/signals-systems/
        run: node tests/ss-navigation-visual-e2e.mjs
      - name: Signals English chapter regression
        id: ss_english
        continue-on-error: true
        working-directory: signals-systems
        env:
          SS_BASE_URL: http://127.0.0.1:8788/signals-systems/
        run: node tests/ss-english-content-e2e.mjs
      - name: Fail on regression findings
        if: always()
        run: |
          test '${{ steps.c_browser.outcome }}' = 'success'
          test '${{ steps.shared_state.outcome }}' = 'success'
          test '${{ steps.ss_nav.outcome }}' = 'success'
          test '${{ steps.ss_english.outcome }}' = 'success'
