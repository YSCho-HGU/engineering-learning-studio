name: Studio shared header and Signals full-theme math QA
on:
  push:
    branches: [main]
    paths:
      - 'assets/els-header-controls.*'
      - 'assets/studio-course-cards.css'
      - 'index.html'
      - 'c-programming/index.html'
      - 'signals-systems/chapter*.html'
      - 'signals-systems/index.html'
      - 'tests/studio-theme-math-e2e.mjs'
      - 'tests/studio-header-controls-e2e.mjs'
      - '.github/workflows/studio-shared-design-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ss-contrast-math:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: 
          node-version: '22'
      - name: Install Chromium and Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: WCAG palette static contrast audit
        working-directory: signals-systems
        run: node tests/theme-contrast-audit.mjs
      - name: ELS header and settings regression
        run: node tests/studio-header-controls-e2e.mjs
      - name: S&S chapter-theme math and contrast regression
        run: node tests/studio-theme-math-e2e.mjs
      - name: Save audit details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-theme-math-report
          path: qa-theme-math/report.json
          if-no-files-found: ignore
