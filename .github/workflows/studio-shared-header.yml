name: Studio shared header regression
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'c-programming/**/*.html'
      - 'c-programming/c-ss-shell.js'
      - 'c-programming/c-ss-shell.css'
      - 'signals-systems/*.html'
      - 'signals-systems/assets/ss-common-header.js'
      - 'signals-systems/assets/ss-common-header.css'
      - 'assets/els-header-controls.css'
      - 'assets/els-header-controls.js'
      - 'assets/els-course-header.css'
      - 'signals-systems/assets/ss-common-header.css'
      - 'signals-systems/assets/ss-common-header.js'
      - 'tests/studio-header-contract-e2e.mjs'
      - 'tests/studio-header-inventory.mjs'
      - '.github/workflows/studio-shared-header.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'c-programming/**/*.html'
      - 'c-programming/c-ss-shell.js'
      - 'c-programming/c-ss-shell.css'
      - 'signals-systems/*.html'
      - 'signals-systems/assets/ss-common-header.js'
      - 'signals-systems/assets/ss-common-header.css'
      - 'assets/els-header-controls.*'
      - 'assets/els-course-header.css'
      - 'c-programming/c-ss-shell.*'
      - 'signals-systems/assets/ss-common-header.*'
      - 'tests/studio-header-contract-e2e.mjs'
      - 'tests/studio-header-inventory.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  header-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check complete header asset inventory
        run: node tests/studio-header-inventory.mjs
      - name: Run cross-course responsive header contract
        run: node tests/studio-header-contract-e2e.mjs
      - name: Upload representative C and SS header screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-header-render-check
          path: qa/header-screenshots/*.png
          if-no-files-found: ignore
