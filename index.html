<!doctype html>
<html lang="en"><head><script>/* Apply selected palette before CSS paint. */(function(){var t="neutral-dark";try{var v=localStorage.getItem("els-theme-v2");if(["neutral-dark","warm-dark","navy-dark","warm-neutral","white-clean"].includes(v))t=v;else if(v==="white")t="white-clean";else{var ss=localStorage.getItem("ss-visual-lab-theme"),e=localStorage.getItem("els-theme");if(ss==="light"||e==="light")t="warm-neutral";else if(ss==="dark"||e==="dark")t="navy-dark"}}catch(e){}document.documentElement.dataset.elsTheme=t;document.documentElement.dataset.theme=["warm-neutral","white-clean"].includes(t)?"light":"dark";document.documentElement.style.colorScheme=["warm-neutral","white-clean"].includes(t)?"only light":"dark"})();</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Open interactive engineering education platform"><title>Engineering Learning Studio</title>

<style>
:root{
 --studio-width:1160px;
 font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",Arial,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
 margin:0;background:var(--els-page,#101010);color:var(--els-ink,#f0f0ed);
 font:16px/1.7 system-ui,-apple-system,"Segoe UI","Malgun Gothic",Arial,sans-serif;
}
a{color:inherit}
a:focus-visible,select:focus-visible{outline:3px solid var(--els-focus,#ead18b);outline-offset:3px}
.skip-link{position:absolute;top:-100px;left:12px;padding:9px 14px;z-index:100;
 background:var(--els-surface,#1c1c1c);color:var(--els-ink,#fff);border-radius:7px}
.skip-link:focus{top:8px}
.site-header{
 position:sticky;top:0;z-index:30;min-height:70px;background:var(--els-surface,#1c1c1c);
 border-bottom:1px solid var(--els-border,#565b57);
}
.site-header .header-inner{
 width:min(calc(100% - 48px),var(--studio-width));min-height:70px;margin:auto;
 display:flex;align-items:center;justify-content:space-between;gap:20px;
}
.site-header .brand{display:inline-flex;align-items:center;gap:11px;text-decoration:none;
 color:var(--els-ink,#f0f0ed);font-size:14px;font-weight:850;letter-spacing:-.02em;white-space:nowrap}
.site-header .brand-mark{
 display:grid;place-items:center;width:36px;height:36px;flex-shrink:0;
 border:1px solid var(--els-border,#565b57);border-radius:10px;
 background:var(--els-surface-alt,#292929);color:var(--els-link,#b9d7c8);font-size:18px;
}
.site-header .header-nav{display:flex;align-items:center;gap:9px;min-width:0}
.site-header label{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
 font-size:12px;font-weight:700;color:var(--els-muted,#c1c5c1)}
.site-header select{height:34px;min-height:34px;padding:4px 9px;border-radius:8px;
 border:1px solid var(--els-border,#565b57);background:var(--els-surface,#1c1c1c);
 color:var(--els-ink,#f0f0ed);font-size:12px;line-height:1.4;font-family:inherit;max-width:170px}
.site-header select{font-family:inherit;font-size:12px;line-height:1.4}
main,.site-footer{width:min(calc(100% - 48px),var(--studio-width));margin:0 auto}
.studio-intro{
 margin:18px 0 22px;padding:clamp(22px,2.7vw,30px);
 border-radius:18px;border:1px solid var(--els-border,#565b57);
 background:linear-gradient(120deg,var(--els-surface-alt,#292929),var(--els-surface,#1c1c1c) 75%);
}
.eyebrow{margin:0 0 7px;color:var(--els-link,#b9d7c8);font-size:12px;font-weight:850;letter-spacing:.09em}
.studio-intro h1{font-size:clamp(28px,3.1vw,38px);line-height:1.18;letter-spacing:-.04em;margin:0 0 10px}
.studio-intro .intro-copy{font-size:15px;line-height:1.55;color:var(--els-muted,#c1c5c1);
 max-width:760px;margin:0;white-space:pre-line}
.course-section{margin:0 0 30px;scroll-margin-top:86px}
.course-section-head{margin-bottom:12px}
.course-section-head .eyebrow{font-size:11px;margin-bottom:4px}
.course-section-head h2{font-size:clamp(21px,2.4vw,26px);line-height:1.3;
 letter-spacing:-.025em;margin:0 0 4px}
.course-section-head p{margin:0;font-size:14px;color:var(--els-muted,#c1c5c1);white-space:pre-line}
.available-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.course-card{
 display:flex;flex-direction:column;min-width:0;padding:24px;border:1px solid var(--els-border,#565b57);
 border-radius:15px;background:var(--els-surface,#1c1c1c);
}
.course-card--available{
 text-decoration:none;transition:border-color .15s ease,transform .15s ease,background .15s ease
}
.course-card--available:hover{transform:translateY(-2px);border-color:var(--els-link,#b9d7c8);
 background:var(--els-surface-alt,#292929)}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}
.card-symbol{width:41px;height:41px;border:1px solid var(--els-border,#565b57);border-radius:11px;
 display:grid;place-items:center;background:var(--els-surface-alt,#292929);
 color:var(--els-link,#b9d7c8);font-size:19px;font-weight:850}
.card-status{border:1px solid var(--els-border,#565b57);border-radius:999px;
 padding:4px 10px;font-size:11px;line-height:1.45;font-weight:750;white-space:nowrap}
.card-status--available{background:var(--els-info-bg,#293833);color:var(--els-info-ink,#e0f2e6)}
.course-card h3{font-size:21px;line-height:1.32;letter-spacing:-.025em;margin:0 0 8px}
.course-card .card-korean{font-size:13px;font-weight:600;color:var(--els-muted,#c1c5c1);margin:-3px 0 10px}
.course-card p{font-size:14px;line-height:1.65;color:var(--els-muted,#c1c5c1);
 margin:0 0 20px;white-space:pre-line;flex:1}
.card-action{display:flex;align-items:center;justify-content:space-between;gap:10px;
 border-top:1px solid var(--els-border,#565b57);padding-top:13px;
 font-size:13px;font-weight:800;color:var(--els-link,#b9d7c8)}
.card-action .arrow{font-size:20px;line-height:1}
.planned-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.course-card--planned{
 background:color-mix(in srgb,var(--els-surface,#1c1c1c) 55%,var(--els-page,#101010));
 border-color:color-mix(in srgb,var(--els-border,#565b57) 65%,var(--els-page,#101010));
}
.course-card--planned .card-symbol{
 background:transparent;color:var(--els-muted,#c1c5c1);
 border-color:color-mix(in srgb,var(--els-border,#565b57) 65%,transparent)
}
.course-card--planned .card-status{color:var(--els-muted,#c1c5c1);
 background:var(--els-surface-alt,#292929);border-color:transparent}
.course-card--planned h3{font-size:17px}
.course-card--planned p{font-size:13px;margin-bottom:0}
.course-card--planned{cursor:default}
.site-footer{border-top:1px solid var(--els-border,#565b57);margin-top:42px;padding:23px 0 40px;
 color:var(--els-muted,#c1c5c1);font-size:12px}
@media(max-width:960px){.planned-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){
 .site-header .header-inner{flex-wrap:wrap;padding:10px 0;row-gap:6px}
 .site-header .brand{font-size:13px}
 .site-header .header-nav{margin-left:auto}
 .available-grid{grid-template-columns:1fr}
 .studio-intro{margin-top:14px;margin-bottom:20px;padding:21px}
}
@media(max-width:520px){
 main,.site-footer,.site-header .header-inner{width:min(calc(100% - 28px),var(--studio-width))}
 .site-header .header-nav{width:100%;justify-content:flex-end}
 .site-header select{max-width:145px}
 .planned-grid{grid-template-columns:1fr}
 .course-card{padding:18px}
}
@media(prefers-reduced-motion:reduce){.course-card--available{transition:none}}
</style><link rel="stylesheet" href="./assets/els-theme-v2.css?v=6"><link rel="stylesheet" href="assets/els-typography-standard.css?v=1"><link rel="stylesheet" href="./assets/els-header-controls.css?v=shared-mobile-20261124"><link rel="stylesheet" href="./assets/studio-course-cards.css?v=3"></head><body>
<a class="skip-link" href="#studio-main">Skip to courses</a>
<header class="site-header" aria-label="Engineering Learning Studio navigation">
 <div class="header-inner">
  <a class="brand" href="./" aria-label="Engineering Learning Studio home"><span class="brand-mark" aria-hidden="true">◈</span><span>Engineering Learning Studio</span></a>
  <nav class="header-nav" aria-label="Display settings">
   <label class="language-control" for="lang"><span>Language</span>
    <select id="lang" aria-label="Language"><option value="mixed">ENG + 한국어</option><option value="en">English</option><option value="ko">한국어</option></select>
   </label>
   <label class="theme-control" for="theme"><span>Theme</span>
    <select id="theme" data-els-theme-picker aria-label="Theme"></select>
   </label>
  </nav>
 </div>
</header>

<main id="studio-main">
 <section class="studio-intro" aria-labelledby="studio-title">
  <p class="eyebrow" data-en="ENGINEERING · INTERACTIVE LEARNING" data-ko="공학 · 인터랙티브 학습">ENGINEERING · INTERACTIVE LEARNING</p>
  <h1 id="studio-title">Engineering Learning Studio</h1>
  <p class="intro-copy" data-en="Understand engineering concepts through visual experiments, careful reasoning, and hands-on programming." data-ko="시각적 실험과 단계별 사고, 직접 프로그래밍을 통해 공학의 핵심 개념을 이해합니다."></p>
 </section>
 <section class="course-section" id="available" aria-labelledby="available-title">
  <div class="course-section-head">
   <p class="eyebrow" data-en="AVAILABLE NOW" data-ko="현재 이용 가능">AVAILABLE NOW</p>
   <h2 id="available-title" data-en="Explore courses" data-ko="학습 가능한 교과목">Explore courses</h2>
  </div>
  <div class="available-grid" id="available-courses"></div>
 </section>
 <section class="course-section" id="upcoming" aria-labelledby="upcoming-title">
  <div class="course-section-head">
   <p class="eyebrow" data-en="PLANNED COURSES" data-ko="준비 중인 교과목">PLANNED COURSES</p>
   <h2 id="upcoming-title" data-en="Coming soon" data-ko="추후 제공">Coming soon</h2>
  </div>
  <div class="planned-grid" id="planned-courses"></div>
 </section>
</main>
<footer class="site-footer">Engineering Learning Studio · <span data-en="Interactive engineering education" data-ko="인터랙티브 공학교육">Interactive engineering education</span></footer>
<script src="./assets/els-language.js?v=1"></script><script>

"use strict";
const courses=[
 {id:"ss",en:"Signals & Systems",ko:"신호 및 시스템",
  descriptionEn:"Signals, systems, convolution, Fourier and Laplace transforms, sampling, and interactive applications.",
  descriptionKo:"신호와 시스템, 컨볼루션, 푸리에·라플라스 변환, 샘플링 및 인터랙티브 응용 실습.",
  href:"./signals-systems/",symbol:"∿",available:true},
 {id:"c",en:"C Programming",ko:"C 프로그래밍",
  descriptionEn:"Learn C through concepts, code tracing, visual explanations, and hands-on coding practice.",
  descriptionKo:"핵심 개념, 코드 실행 예측, 시각적 설명과 직접 코딩하는 학습 활동.",
  href:"./c-programming/",symbol:"{ }",available:true},
 {id:"logic",en:"Logic Design",ko:"논리회로설계",
  descriptionEn:"Boolean logic, combinational and sequential circuits.",
  descriptionKo:"불 대수, 조합논리회로와 순차논리회로.",
  symbol:"⊕",available:false},
 {id:"dsp",en:"Digital Signal Processing",ko:"디지털신호처리",
  descriptionEn:"Discrete-time processing, FFT, and digital filters.",
  descriptionKo:"이산시간 신호처리, FFT 및 디지털 필터.",
  symbol:"≈",available:false},
 {id:"python",en:"Python Programming",ko:"파이썬 프로그래밍",
  descriptionEn:"Programming foundations, data processing, and visualization.",
  descriptionKo:"프로그래밍 기초, 데이터 처리 및 시각화.",
  symbol:"Py",available:false},
 {id:"ai",en:"AI / AX",ko:"AI / AX",
  descriptionEn:"AI models, applications, and engineering transformation.",
  descriptionKo:"AI 모델, 응용 및 공학 분야의 AI 전환.",
  symbol:"AI",available:false}
];
const language=window.ELSLanguage;
if(!language)throw Error("Shared language module not loaded");
function translate(en,ko,mode){
 if(mode==="en")return en;
 if(mode==="ko")return ko;
 return en===ko?en:en+"\n"+ko;
}
function element(tag,cls,value){
 const e=document.createElement(tag);
 if(cls)e.className=cls;
 if(value!=null)e.textContent=value;
 return e;
}
function waveformSvg(isOutput){
 const NS="http://www.w3.org/2000/svg",svg=document.createElementNS(NS,"svg");
 svg.setAttribute("viewBox","0 0 140 64");
 svg.setAttribute("preserveAspectRatio","none");
 svg.classList.add("ss-diagram-svg");
 svg.setAttribute("aria-hidden","true");
 function shape(tag,attributes,cssClass){
  const node=document.createElementNS(NS,tag);
  if(cssClass)node.setAttribute("class",cssClass);
  Object.entries(attributes).forEach(([key,value])=>node.setAttribute(key,String(value)));
  svg.appendChild(node);
  return node;
 }
 shape("line",{x1:0,y1:32,x2:140,y2:32},"axis");
 shape("line",{x1:0,y1:6,x2:0,y2:58},"axis");
 let d="";
 for(let i=0;i<=112;i++){
  const t=i/112*4*Math.PI;
  const y=isOutput?
   .60*Math.sin(t-.50)+.055*Math.sin(4*t-1.5):
   .65*Math.sin(t)+.23*Math.sin(4*t);
  const x=140*i/112,py=32-26*y;
  d+=(i===0?"M":" L")+x.toFixed(2)+","+py.toFixed(2);
 }
 shape("path",{d},isOutput?"signal output":"signal");
 return svg;
}
function courseVisual(course,mode){
 if(!course.available)return null;
 const pane=element("div","course-preview");
 pane.setAttribute("role","group");
 pane.setAttribute("aria-label",translate(course.id==="ss"?"Example of a signal passing through a system":"Example of tracing C code output",
  course.id==="ss"?"시스템에 통과하는 신호의 예시":"C 코드 실행 결과 예시",mode).replace(/\n/g," / "));
 const head=element("div","course-preview-head");
 const title=element("span","course-preview-title",translate(course.id==="ss"?"Signal → System → Response":"Code → Output",
  course.id==="ss"?"신호 → 시스템 → 응답":"코드 → 출력",mode).replace(/\n/g," · "));
 const kicker=element("span","course-preview-kicker",translate("Visual preview","시각적 미리보기",mode).replace(/\n/g," · "));
 head.append(title,kicker);pane.append(head);
 if(course.id==="ss"){
  const diagram=element("div","ss-diagram");
  const left=element("div","ss-diagram-cell");
  left.append(element("div","ss-diagram-label",translate("Input x(t)","입력 x(t)",mode).replace(/\n/g," · ")),waveformSvg(false));
  const system=element("div","ss-diagram-system");
  const block=element("div","system-block","LTI");
  const path=element("div","system-path");
  for(const item of [element("span","flow-arrow","→"),block,element("span","flow-arrow","→")]){
   if(item!==block)item.setAttribute("aria-hidden","true");
   path.append(item);
  }
  system.append(path,element("div","system-caption",translate("System","시스템",mode).replace(/\n/g," · ")));
  const right=element("div","ss-diagram-cell");
  right.append(element("div","ss-diagram-label",translate("Output y(t)","출력 y(t)",mode).replace(/\n/g," · ")),waveformSvg(true));
  diagram.append(left,system,right);pane.append(diagram);
 }else if(course.id==="c"){
  const diagram=element("div","c-code-diagram");
  const source=element("div","c-code-source");
  source.append(element("code","", 'int x = 3;\nx += 2;\nprintf("%d", x);'));
  const result=element("div","c-code-result");
  result.append(element("span","result-label",translate("Output","출력",mode).replace(/\n/g," · ")),
                element("strong","result-number","5"));
  diagram.append(source,result);pane.append(diagram);
 }
 return pane;
}
function learningMethods(course,mode){
 const methods=course.id==="ss"?
  [["Signals","신호"],["Systems","시스템"],["Transforms","변환"],["Applications","응용"]]:
  [["Understand","이해"],["Predict","예측"],["Explore","탐색"],["Practice","실습"],["Check","점검"]];
 const row=element("div","course-methods");
 row.setAttribute("role","list");
 row.setAttribute("aria-label",translate("Learning topics and activities","학습 주제 및 활동",mode).replace(/\n/g," / "));
 for(const [index,item] of methods.entries()){
  const chip=element("span","course-method");
  chip.setAttribute("role","listitem");
  chip.append(element("span","course-method-number",String(index+1).padStart(2,"0")),
              document.createTextNode(translate(item[0],item[1],mode).replace(/\n/g," · ")));
  row.append(chip);
 }
 return row;
}
function card(course,mode){
 const root=element(course.available?"a":"article","course-card "+(course.available?"course-card--available":"course-card--planned"));
 root.dataset.course=course.id;
 if(course.available){
  root.href=course.href;
  root.setAttribute("aria-label",translate("Open "+course.en,course.ko+" 학습 열기",mode).replace(/\n/g," / "));
 }else root.setAttribute("aria-disabled","true");
 const head=element("div","card-head");
 const symbol=element("span","card-symbol",course.symbol);
 symbol.setAttribute("aria-hidden","true");
 const status=element("span","card-status "+(course.available?"card-status--available":""),
  course.available?translate("Available","이용 가능",mode).replace(/\n/g," · "):
  translate("Coming soon","추후 제공",mode).replace(/\n/g," · "));
 head.append(symbol,status);root.append(head);
 if(course.available){
  const focus=course.id==="ss"?
   translate("VISUAL SIGNAL LEARNING","시각적 신호 학습",mode):
   translate("TRACE · EXPLORE · PRACTICE","코드 예측 · 탐색 · 실습",mode);
  root.append(element("div","course-focus",focus.replace(/\n/g," · ")));
 }
 root.append(element("h3","",mode==="ko"?course.ko:course.en));
 if(mode==="mixed"&&course.ko!==course.en)root.append(element("div","card-korean",course.ko));
 root.append(element("p","",translate(course.descriptionEn,course.descriptionKo,mode)));
 if(course.available){
  root.append(courseVisual(course,mode),learningMethods(course,mode));
  const action=element("div","card-action",translate("Open course","교과목 열기",mode).replace(/\n/g," · "));
  const arrow=element("span","arrow","→");arrow.setAttribute("aria-hidden","true");action.append(arrow);root.append(action);
 }
 return root;
}
function render(){
 const mode=language.get();
 document.documentElement.lang=mode==="en"?"en":"ko";
 document.querySelectorAll("[data-en][data-ko]").forEach(el=>{
  el.textContent=translate(el.dataset.en,el.dataset.ko,mode);
 });
 document.getElementById("available-courses").replaceChildren(...courses.filter(x=>x.available).map(x=>card(x,mode)));
 document.getElementById("planned-courses").replaceChildren(...courses.filter(x=>!x.available).map(x=>card(x,mode)));
}
language.bindSelect("#lang");
language.subscribe(render);
render();
</script><script src="./assets/els-theme-v2.js?v=6" defer></script><script src="./assets/els-header-controls.js?v=shared-mobile-20261124" defer></script></body></html>
