<section class="d-card" id="predict"><h2 data-en="1 · Predict — what will change?" data-ko="1 · 예측 — 무엇이 바뀔까요?"></h2><p data-en="Choose which sound characteristic will change when high frequencies are attenuated." data-ko="고주파를 감쇠시키면 어떤 소리 특성이 변할지 예상해 보세요."></p><div class="d-predict" id="predict-options"></div><button class="d-action" id="predict-check" data-en="Check prediction" data-ko="예측 확인"></button><p class="d-feedback" id="predict-result" aria-live="polite"></p></section>
<section class="d-card" id="experiment"><h2 data-en="2 · Experiment — design a filter" data-ko="2 · 실험 — 필터 설계"></h2><p class="d-muted" data-en="Use the generated signal. Audio plays only after pressing a button." data-ko="생성된 신호를 사용합니다. 오디오는 버튼을 누를 때만 재생됩니다."></p><div class="d-layout"><div>
<label class="d-field"><span data-en="Input signal" data-ko="입력 신호"></span><select id="source"><option value="voice" data-en="Synthetic vowel-like sound" data-ko="합성 모음 유사 소리"></option><option value="tones" data-en="Two-tone signal" data-ko="두 개의 정현파"></option></select></label>
<label class="d-field"><span data-en="Filter type" data-ko="필터 종류"></span><select id="filter"><option value="low" data-en="Low-pass" data-ko="저역통과"></option><option value="high" data-en="High-pass" data-ko="고역통과"></option><option value="band" data-en="Band-pass" data-ko="대역통과"></option></select></label>
<label class="d-field"><span data-en="Cutoff / center frequency (Hz)" data-ko="차단 / 중심 주파수 (Hz)"></span><output class="d-range-value" id="cutoff-value"></output><input type="range" id="cutoff" min="150" max="2600" step="50" value="950"></label>
<label class="d-field"><span data-en="Band width (Hz)" data-ko="통과 대역폭 (Hz)"></span><output class="d-range-value" id="band-value"></output><input type="range" id="band" min="150" max="1800" step="50" value="650"></label>
<div class="d-buttons"><button id="play-original" data-en="▶ Original" data-ko="▶ 원본 듣기"></button><button id="play-filtered" data-en="▶ Filtered" data-ko="▶ 필터 후 듣기"></button><button id="stop" data-en="■ Stop" data-ko="■ 정지"></button><button id="reset" data-en="Reset" data-ko="초기화"></button></div></div><div><p class="d-stage" id="audio-insight" aria-live="polite"></p><div class="d-formula" data-ss-math="Y(e^{j\omega})=H(e^{j\omega})X(e^{j\omega})" data-ss-math-display="block"></div><p class="d-hint" data-en="A finite-length FIR approximation implements the selected frequency response. The graphs use the computed output, not an idealized sketch." data-ko="선택한 주파수 응답은 유한 길이 FIR 필터로 근사합니다. 그래프는 이상적인 그림이 아니라 실제 계산된 출력 결과입니다."></p><div class="d-plot"><figure><canvas id="gainplot" width="680" height="240"></canvas><figcaption data-en="FIR magnitude response (dB): dashed markers show the selected nominal cutoff or passband edges; actual −3 dB crossings can differ." data-ko="FIR 크기 응답(dB): 점선은 설정한 차단주파수 또는 통과대역 경계입니다. 실제 −3 dB 위치는 다를 수 있습니다."></figcaption></figure></div>
<div class="d-stage" id="cutoff-explain" aria-live="polite"></div>
</div></div></section>
<section class="d-card" id="observe">
<h2 data-en="3 · Observe — what did my filter change?" data-ko="3 · 관찰 — 내가 설정한 필터가 무엇을 바꾸었을까요?"></h2>
<p class="d-muted" data-en="The graphs below update with the filter you set in Step 2." data-ko="아래 그래프는 2번에서 설정한 필터값에 따라 함께 갱신됩니다."></p>
<div class="d-observe-bridge" aria-live="polite">
 <div class="d-bridge-heading" data-en="Live connection to Step 2" data-ko="2번 실험의 현재 설정과 실시간 연결"></div>
 <div id="observe-settings" class="d-observe-settings"></div>
 <a href="#experiment" class="d-observe-edit" data-en="↑ Change settings in Step 2" data-ko="↑ 2번으로 돌아가 설정 바꾸기"></a>
</div>
<p class="d-instruction" data-en="Try Two-tone → Low-pass, 950 Hz. In A, compare the 250 Hz and 1950 Hz peaks; in B, examine the same signals over time. Return to Step 2 and switch to High-pass." data-ko="‘두 정현파 → 저역통과 950 Hz’를 선택하세요. A에서 250 Hz와 1950 Hz 피크를 비교하고 B에서 같은 신호의 시간 파형을 확인하세요. 이후 2번으로 돌아가 고역통과로 바꿔 보세요."></p>
<div class="d-observe-step">
 <div class="d-observe-step-heading"><span class="d-step-letter">A</span><div><h3 data-en="Frequency-domain result — which components remain?" data-ko="주파수영역 결과 — 어떤 성분이 남았나요?"></h3><p data-en="Compare blue (input) with orange (filtered output). A tall orange peak means that frequency remains; a much smaller orange peak means it was attenuated." data-ko="파란색(입력)과 주황색(필터 출력)을 비교하세요. 주황 피크가 높게 남으면 그 주파수는 통과했고, 크게 낮아졌으면 감쇠된 것입니다."></p></div></div>
 <div class="d-plot"><figure><canvas id="specplot" width="680" height="300"></canvas><figcaption data-en="Same input and filter as Step 2 · 2048-point FFT · horizontal axis: frequency (Hz), vertical axis: relative magnitude (dB)" data-ko="2번과 동일한 입력·필터 · 2048점 FFT · 가로축: 주파수(Hz), 세로축: 상대 크기(dB)"></figcaption></figure></div>
 <p id="spectrum-guide" class="d-stage" aria-live="polite"></p>
</div>
<div class="d-observe-step">
 <div class="d-observe-step-heading"><span class="d-step-letter">B</span><div><h3 data-en="Time-domain result — how did the waveform change?" data-ko="시간영역 결과 — 파형은 어떻게 바뀌었나요?"></h3><p data-en="The blue and orange traces are the same signals shown in A, now plotted against time. Compare their shape and timing; then listen again in Step 2." data-ko="A에서 비교한 동일한 두 신호를 이번에는 시간축으로 나타냈습니다. 모양과 시간적 위치를 비교한 뒤 2번에서 소리도 다시 들어보세요."></p></div></div>
 <div class="d-plot"><figure><canvas id="waveplot" width="680" height="300"></canvas><figcaption data-en="Input x[n] (blue) and causal FIR output y[n] (orange), first 40 ms · horizontal axis: time (ms)" data-ko="입력 x[n](파랑)과 인과적 FIR 출력 y[n](주황), 처음 40 ms · 가로축: 시간(ms)"></figcaption></figure></div>
 <p id="wave-guide" class="d-stage" aria-live="polite"></p>
</div>
<details class="d-observe-optional" id="d1-delay-detail">
 <summary data-en="Optional · Why is the output delayed? (impulse response)" data-ko="선택 심화 · 출력이 늦어지는 이유는? (임펄스 응답)"></summary>
 <p data-en="This is a separate test input (an impulse), not the sound selected in Step 2. It helps explain the delay caused by the same FIR filter. Its coefficients stay the same when you change the filter in Step 2." data-ko="여기서는 2번에서 선택한 소리 대신 임펄스를 시험 입력으로 사용합니다. 다만 필터 자체는 2번에서 설정한 동일한 FIR 필터입니다. 이 그래프로 필터가 만드는 시간 지연을 설명합니다."></p>
 <div class="d-plot"><figure><canvas id="impulseplot" width="680" height="240"></canvas><figcaption data-en="Illustrative impulse input at 8 ms and the response of the SAME FIR filter · center shift: 50 samples = 6.25 ms" data-ko="8 ms에서 가한 임펄스와 ‘동일한 FIR 필터’의 응답 · 중심 이동: 50표본 = 6.25 ms"></figcaption></figure></div>
 <div class="d-stage" id="delay-explain" aria-live="polite"></div>
</details>
<div class="d-metrics"><div class="d-metric"><strong id="atten">—</strong><span data-en="Output / input RMS (dB)" data-ko="출력 / 입력 RMS (dB)"></span></div><div class="d-metric"><strong id="delay">—</strong><span data-en="FIR group delay (ms)" data-ko="FIR 군지연 (ms)"></span></div><div class="d-metric"><strong id="rms">—</strong><span data-en="Output RMS" data-ko="출력 RMS"></span></div></div>
<p class="d-observe-conclusion" data-en="Conclusion: the filter changes the strengths of frequency components, which changes the sound without changing the sampling rate." data-ko="결론: 필터는 주파수별 성분의 크기를 바꾸므로 샘플링 주파수를 바꾸지 않고도 소리가 달라집니다."></p>
</section>
<details class="d-observe-optional" id="d1-theory">
 <summary data-en="Optional foundations · What do cutoff, FFT and dB mean?" data-ko="선택 기초 설명 · 차단주파수·FFT·dB의 의미"></summary>
 <p data-en="A filter passes some frequencies more strongly than others. A cutoff is a useful reference for the transition, not a wall that deletes everything beyond it. In Step 3A, FFT separates the recorded signal into frequency components; the vertical axis in dB displays their relative strengths." data-ko="필터는 주파수에 따라 신호를 서로 다르게 통과시킵니다. 차단주파수는 통과와 감쇠의 변화가 일어나는 기준이며, 그 너머의 모든 성분을 갑자기 없애는 벽은 아닙니다. 3A의 FFT는 신호를 주파수 성분으로 나누어 보여주고, dB 세로축은 성분 간 상대적 크기를 나타냅니다."></p>
 <p data-en="Blue and orange spectra use one common reference, so compare their heights at the SAME frequency. A lower orange peak indicates attenuation." data-ko="파란색과 주황색 스펙트럼은 동일한 기준으로 표시됩니다. 따라서 같은 주파수에서 두 피크의 높이를 비교하세요. 주황색이 낮으면 해당 성분이 감쇠된 것입니다."></p>
 </details><section class="d-card" id="explain"><h2 data-en="4 · Explain & transfer" data-ko="4 · 설명과 응용"></h2><p data-en="With the Two-tone example, which of the 250 Hz and 1950 Hz components survives a 950 Hz low-pass filter more strongly? Explain your answer using graph A and listening in Step 2. Then switch to high-pass: does your prediction reverse?" data-ko="두 정현파 예제에서 950 Hz 저역통과 필터를 사용하면 250 Hz와 1950 Hz 중 어느 성분이 더 강하게 남나요? 3A 스펙트럼과 2번의 소리로 설명하세요. 이어서 고역통과로 바꾸면 예측한 결과가 반대로 나타나는지 확인하세요."></p><p class="d-note" data-en="Connection: Chapter 2 convolution → Chapter 4 frequency response → Chapter 6 DTFT → Part C FFT." data-ko="연결: Chapter 2 컨벌루션 → Chapter 4 주파수 응답 → Chapter 6 DTFT → Part C FFT"></p></section></main>
