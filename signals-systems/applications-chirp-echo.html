<main class="d-shell"><a class="d-back" href="./applications.html#part-d" data-en="← Part D · All integrated labs" data-ko="← Part D · 종합 실습 목록"></a><div class="d-hero"><div class="d-eyebrow">SIGNALS &amp; SYSTEMS · PART D · D2</div><h1 data-en="Detect the Invisible · Chirp Echo Detection" data-ko="보이지 않는 물체 탐지 · 처프 반사파 측정"></h1><p data-en="Send a chirp, shift a reference signal, and find the echo delay from correlation." data-ko="처프를 송신하고 기준 신호를 이동시켜 상호상관으로 반사 지연을 찾습니다."></p></div><nav class="d-steps"><a href="#predict" data-en="1 · Predict" data-ko="1 · 예측"></a><a href="#experiment" data-en="2 · Experiment" data-ko="2 · 실험"></a><a href="#observe" data-en="3 · Observe" data-ko="3 · 관찰"></a><a href="#explain" data-en="4 · Explain" data-ko="4 · 설명"></a></nav>
<section class="d-card" id="predict"><h2 data-en="1 · Predict — how can we find an echo?" data-ko="1 · 예측 — 반사파를 어떻게 찾을까요?"></h2><p data-en="The echo is delayed and noisy. Can comparing signal similarity at many delays reveal the round-trip travel time?" data-ko="반사파는 지연되고 잡음이 섞여 있습니다. 여러 지연에서 신호의 유사도를 비교하면 왕복 시간을 찾을 수 있을까요?"></p><div class="d-predict" id="predict-options"></div><button id="predict-check" class="d-action" data-en="Check prediction" data-ko="예측 확인"></button><p class="d-feedback" id="predict-result" aria-live="polite"></p></section>
<section class="d-card" id="experiment"><h2 data-en="2 · Experiment — create an echo scenario" data-ko="2 · 실험 — 반사파 상황 만들기"></h2>
<p class="d-muted" data-en="Set the medium, target distance, noise, and chirp bandwidth. These four settings generate the received signal in Step 3; you do not need to launch a second experiment." data-ko="매질, 물체 거리, 잡음, 처프 대역폭을 설정하세요. 네 가지 설정으로 만들어진 수신 신호가 그대로 3번에 나타납니다. 별도 실행 버튼이나 두 번째 실험은 필요하지 않습니다."></p><div class="d-layout"><div>
<label class="d-field"><span data-en="Medium" data-ko="전파 매질"></span><select id="medium"><option value="sound" data-en="Air / sound (343 m/s)" data-ko="공기 / 소리 (343 m/s)"></option><option value="water" data-en="Water / sonar (1500 m/s)" data-ko="물 / 소나 (1500 m/s)"></option></select></label>
<label class="d-field"><span data-en="Target distance (m)" data-ko="목표물 거리 (m)"></span><output class="d-range-value" id="distance-value"></output><input id="distance" type="range" min="5" max="38" value="17" step="1"></label>
<label class="d-field"><span data-en="Noise strength" data-ko="잡음 강도"></span><output class="d-range-value" id="noise-value"></output><input id="noise" type="range" min="0" max="100" step="10" value="30"></label>
<label class="d-field"><span data-en="Chirp bandwidth" data-ko="처프 대역폭"></span><select id="bandwidth"><option value="wide" data-en="Wide sweep (500–2500 Hz)" data-ko="넓은 스윕 (500–2500 Hz)"></option><option value="narrow" data-en="Narrow sweep (1000–1500 Hz)" data-ko="좁은 스윕 (1000–1500 Hz)"></option></select></label>
<div class="d-buttons"><button id="new-noise" data-en="New noise realization" data-ko="새 잡음 생성"></button><button id="reset" data-en="Reset" data-ko="초기화"></button></div></div><div><div class="d-formula" data-ss-math="d=\frac{v\,\Delta t}{2}" data-ss-math-display="block"></div><p class="d-note" data-en="The signal travels to the target and back, so divide the travel distance by two. This is a simple monostatic echo model, without Doppler or multipath." data-ko="신호는 목표물까지 갔다가 되돌아오므로 이동 거리를 2로 나눕니다. 도플러와 다중경로를 제외한 단순 왕복 반사 모델입니다."></p><div class="d-metrics"><div class="d-metric"><strong id="truth">—</strong><span data-en="True delay" data-ko="실제 지연"></span></div><div class="d-metric"><strong id="estimate">—</strong><span data-en="Estimated distance" data-ko="추정 거리"></span></div><div class="d-metric"><strong id="error">—</strong><span data-en="Absolute error" data-ko="절대 오차"></span></div></div></div></div></section>
<section class="d-card" id="observe">
<h2 data-en="3 · Observe — find the echo from Step 2" data-ko="3 · 관찰 — 2번에서 만든 반사파 찾기"></h2>
<p class="d-muted" data-en="The received signal below is generated from the CURRENT Step 2 settings. Changing any setting there immediately updates the received waveform, correlation and estimated distance here." data-ko="아래 수신 신호는 2번의 현재 설정으로 생성된 결과입니다. 2번에서 값을 바꾸면 수신 파형·상관 그래프·추정 거리가 즉시 함께 바뀝니다."></p>
<div class="d-observe-bridge" aria-live="polite">
 <div class="d-bridge-heading" data-en="Live settings from Step 2" data-ko="2번 실험과 실시간 연결된 설정"></div>
 <div id="radar-observe-settings" class="d-observe-settings"></div>
 <a href="#experiment" class="d-observe-edit" data-en="↑ Change distance / noise / chirp in Step 2" data-ko="↑ 2번에서 거리·잡음·처프 다시 조절"></a>
</div>
<p class="d-instruction" data-en="Start here: keep Air, 17 m, 30% noise and the wide chirp. Follow A → B. First find the reflected waveform; then move the blue template until the correlation peaks. Finally change distance to 27 m in Step 2 and compare." data-ko="먼저 공기·17 m·잡음 30%·넓은 처프를 유지하세요. 아래 A → B를 따라 반사파를 살펴보고, 파란 기준 신호를 움직이며 상관 피크를 찾으세요. 이후 2번에서 거리를 27 m로 바꾸어 결과를 비교하세요."></p>
<div class="d-observe-step">
 <div class="d-observe-step-heading"><span class="d-step-letter">A</span><div><h3 data-en="Locate the received echo — slide the blue template" data-ko="반사파 위치 찾기 — 파란 기준 신호 이동"></h3>
 <p data-en="Orange is the noisy echo from Step 2. Blue is a copy of the transmitted chirp. Try shifting blue so its oscillations line up with orange; do not use the height of one peak alone." data-ko="주황색은 2번에서 만든 잡음 섞인 반사파, 파란색은 송신 처프 복사본입니다. 파란 파형을 움직여 주황 파형과 모양이 겹치는 지점을 찾으세요. 한 개의 높은 피크만 보고 판단하지 마세요."></p></div></div>
 <div class="d-plot"><figure><canvas id="echo-plot" width="820" height="290"></canvas><figcaption data-en="Orange = received echo with noise · Blue = movable transmitted template · horizontal axis = time (ms)" data-ko="주황 = 잡음 포함 수신 반사파 · 파랑 = 이동 가능한 송신 기준 신호 · 가로축 = 시간(ms)"></figcaption></figure></div>
 <div class="d-buttons"><button id="lag-back" data-en="← Previous lag" data-ko="← 이전 지연"></button><button id="lag-forward" data-en="Next lag →" data-ko="다음 지연 →"></button><button id="lag-play" data-en="▶ Animate scan" data-ko="▶ 지연 탐색 애니메이션"></button><button id="lag-peak" data-en="Jump to peak" data-ko="최대 상관 위치"></button></div>
 <label class="d-field"><span data-en="Selected candidate echo delay (ms)" data-ko="현재 시험 중인 반사 지연 (ms)"></span><output class="d-range-value" id="lag-value"></output><input id="lag" type="range" min="0" max="250" step="1" value="10"></label>
 <p class="d-stage" id="lag-explain" aria-live="polite"></p>
</div>
<div class="d-observe-step">
 <div class="d-observe-step-heading"><span class="d-step-letter">B</span><div><h3 data-en="Confirm the delay — read the correlation peak" data-ko="지연 확인하기 — 상관 피크 읽기"></h3>
 <p data-en="The green curve measures how similar the two whole chirps are at each delay. The blue dashed line follows your selected delay; the orange dashed line marks the strongest match used to estimate distance." data-ko="초록색 곡선은 각 지연에서 두 처프 전체가 얼마나 비슷한지 나타냅니다. 파란 점선은 현재 선택한 지연, 주황 점선은 거리 추정에 사용하는 가장 잘 일치하는 위치입니다."></p></div></div>
 <div class="d-plot"><figure><canvas id="corr-plot" width="820" height="280"></canvas><figcaption data-en="Normalized cross-correlation versus candidate echo delay (ms) · blue = selected · orange = best match" data-ko="후보 반사 지연(ms)에 따른 정규화 상호상관 · 파랑 = 선택한 지연 · 주황 = 최대 일치 위치"></figcaption></figure></div>
 <div id="radar-result-guide" class="d-stage" aria-live="polite"></div>
 <p class="d-observe-conclusion" data-en="Takeaway: Step 2 creates a delayed echo. In Step 3, A compares waveforms and B finds the time shift of the best match. The system then converts that round-trip time to distance." data-ko="핵심: 2번은 지연된 반사파를 만듭니다. 3번 A는 파형을 비교하고, B는 가장 일치하는 시간 지연을 찾습니다. 마지막으로 신호의 왕복 시간을 거리로 환산합니다."></p>
</div>
<details class="d-observe-optional" id="radar-glossary">
 <summary data-en="Optional basics · Chirp, lag, peak and normalized similarity" data-ko="선택 기초 설명 · 처프·지연·피크·정규화 유사도"></summary>
 <p data-en="Chirp: a signal whose frequency changes over time. Lag: how far a copy is shifted in time. Correlation peak: the time shift where the two whole signals match best. Normalized similarity: a value that makes the comparison less dependent on overall signal strength." data-ko="처프(Chirp)는 시간이 지나며 주파수가 바뀌는 신호입니다. 지연(Lag)은 기준 신호 복사본을 시간축에서 이동한 양입니다. 상관 피크는 전체 파형이 가장 잘 일치하는 지연 위치입니다. 정규화 유사도는 신호의 전체 크기에 덜 의존하도록 보정한 비교값입니다."></p>
 <p data-en="You can complete A and B without calculating any sample products. Open the deeper correlation calculation only after the delay-and-distance idea makes sense." data-ko="A와 B는 표본별 곱셈을 직접 계산하지 않아도 수행할 수 있습니다. 지연과 거리 추정의 연결을 이해한 후에만 상호상관 계산 심화를 펼쳐보세요."></p>
 </details><details class="d-observe-optional" id="radar-theory">
 <summary data-en="Optional foundations · Why does correlation reveal distance?" data-ko="선택 기초 설명 · 상호상관으로 거리를 알 수 있는 이유"></summary>
 <p data-en="A chirp changes frequency as time passes, making its pattern easier to recognize among noise. Cross-correlation compares this entire pattern while sliding it in time; the highest similarity gives the echo's round-trip delay. A distance estimate needs the propagation speed and the factor of two for travel to the target and back." data-ko="처프는 시간이 흐르면서 주파수가 바뀌므로 잡음 속에서도 전체 파형의 특징을 비교하기 좋습니다. 상호상관은 이 파형 전체를 시간축으로 이동시키며 비교하는 방법이며, 가장 잘 맞는 지연이 왕복 전파 시간을 나타냅니다. 거리는 전파 속도를 곱하고 왕복을 고려해 2로 나눕니다."></p>
 <div class="d-formula" data-ss-math="d=\frac{v\,\Delta t}{2}" data-ss-math-display="block"></div>
 <p data-en="A matched pattern can still give an incorrect result if the noise is strong. Compare the known simulated target distance in Step 2 with the detected estimate rather than treating every correlation peak as truth." data-ko="잡음이 강하면 가장 높은 피크가 잘못된 위치에서 나올 수도 있습니다. 따라서 상관 피크가 항상 정답이라고 생각하기보다, 2번에서 알고 있는 목표물 거리와 추정 거리를 비교하세요."></p>
</details>
<details class="d-product-lab" id="correlation-detail" aria-labelledby="product-title"><summary id="product-title" data-en="Optional deep dive · Inspect one correlation calculation" data-ko="선택 심화 · 상호상관 계산 자세히 보기"></summary>
<div class="d-formula" data-ss-math="R_{rx}[\ell]=\sum_n r[n]x[n-\ell]" data-ss-math-display="block"></div>
<p class="d-hint" data-en="For the selected delay, compare each template sample x[i] with the received sample r[t₀ + lag + i]. Their products add to the unnormalized correlation numerator. The normalized value divides this total by both signal energies." data-ko="선택된 지연에서 기준 표본 x[i]와 수신 표본 r[t₀ + lag + i]를 비교합니다. 곱을 합하면 상호상관 분자가 됩니다. 정규화 값은 두 신호 에너지로 나눈 결과입니다."></p>
<div class="d-formula" data-ss-math="S_m(\ell)=\sum_{i=0}^{m}x[i]\,r[t_0+\ell+i]" data-ss-math-display="block"></div>
<label class="d-field" for="sample-index"><span data-en="Sample-by-sample accumulation" data-ko="표본별 곱셈과 누적합"></span><output class="d-range-value" id="sample-value"></output><input id="sample-index" type="range" min="0" max="239" step="1" value="70"></label>
<div class="d-buttons"><button type="button" id="sample-prev" data-en="← Previous sample" data-ko="← 이전 표본"></button><button type="button" id="sample-next" data-en="Next sample →" data-ko="다음 표본 →"></button><button type="button" id="sample-play" data-en="▶ Accumulate" data-ko="▶ 누적합 애니메이션"></button><button type="button" id="sample-complete" data-en="Show complete sum" data-ko="전체 합 보기"></button></div>
<div class="d-plot"><figure><canvas id="product-plot" width="820" height="260"></canvas><figcaption data-en="Product of the two aligned samples at each i; the blue marker shows the current multiplication." data-ko="동일 위치의 두 표본을 곱한 값. 파란 표시점은 현재 곱셈 위치입니다."></figcaption></figure></div>
<div class="d-plot"><figure><canvas id="sum-plot" width="820" height="245"></canvas><figcaption data-en="Running sum Sₘ: one product is added at each step; the final sum is the correlation numerator." data-ko="누적합 Sₘ: 매 단계에서 곱 하나가 더해지며 마지막 값이 상호상관 분자가 됩니다."></figcaption></figure></div>
<div class="d-metrics"><div class="d-metric"><strong id="product-value">—</strong><span data-en="Current product x[i] · r[…]" data-ko="현재 표본의 곱 x[i] · r[…]" ></span></div><div class="d-metric"><strong id="partial-value">—</strong><span data-en="Partial sum Sₘ" data-ko="누적합 Sₘ"></span></div><div class="d-metric"><strong id="norm-value">—</strong><span data-en="Full normalized correlation" data-ko="전체 정규화 상관값"></span></div></div>
<p class="d-stage" id="product-explain" aria-live="polite"></p>
</details><p class="d-hint" data-en="Advanced connection: cross-correlation can be computed using convolution with a time-reversed template (Ch2). Sampled delays are integer sample shifts." data-ko="심화 연결: 상호상관은 시간 반전된 기준 신호와의 컨벌루션으로 계산할 수 있습니다(Ch2). 이산시간 지연은 정수 표본 이동입니다."></p></section>
<section class="d-card" id="explain"><h2 data-en="4 · Explain — verify your discovery" data-ko="4 · 설명 — 발견한 원리를 확인하세요"></h2><p data-en="First, increase the target distance: which way does the echo move and what happens to the estimated distance? Next, increase noise: is the echo harder to see while a correlation peak may remain? Explain the two results using the same Step 2 settings." data-ko="먼저 목표물 거리를 늘려 보세요. 반사파는 어느 방향으로 이동하고 추정 거리는 어떻게 변하나요? 이어서 잡음을 늘려 보세요. 반사파가 눈으로는 더 구분하기 어려워도 상관 피크는 남을 수 있나요? 같은 2번 설정을 사용해 결과를 설명해 보세요."></p><details class="d-observe-optional"><summary data-en="Optional challenge · Why does chirp bandwidth matter?" data-ko="선택 도전 · 처프 대역폭이 중요한 이유는?"></summary><p data-en="Compare wide and narrow sweeps at the same distance and noise level. Observe which produces a sharper correlation peak. A wider sweep usually improves delay resolution when other conditions are comparable." data-ko="거리와 잡음을 고정하고 넓은 처프와 좁은 처프를 비교하세요. 상관 피크가 어느 쪽에서 더 날카로운지 확인하세요. 다른 조건이 같다면 대역폭이 넓을수록 일반적으로 지연 분해능이 좋아집니다."></p></details><p class="d-note" data-en="Connection: Chapter 1 delay → Chapter 2 correlation/convolution → Chapter 4 spectra → Part A chirp → Part C frequency analysis." data-ko="연결: Chapter 1 시간 지연 → Chapter 2 상관/컨벌루션 → Chapter 4 스펙트럼 → Part A 처프 → Part C 주파수 분석"></p></section></main>
