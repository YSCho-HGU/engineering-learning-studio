<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Interactive chirp, FFT, STFT and spectrogram learning lab">
<title>Chirp, STFT &amp; Spectrogram · Engineering Learning Studio</title>
<script>(function(){var v="neutral-dark";try{var s=localStorage.getItem("els-theme-v2");if(["white-clean","warm-neutral","warm-dark","navy-dark","neutral-dark"].includes(s))v=s}catch(e){}document.documentElement.dataset.elsTheme=v;document.documentElement.dataset.theme=["white-clean","warm-neutral"].includes(v)?"light":"dark";document.documentElement.style.colorScheme=["white-clean","warm-neutral"].includes(v)?"only light":"dark"})();</script>
<link rel="stylesheet" href="../assets/els-theme-v2.css?v=6">
<link rel="stylesheet" href="../assets/els-typography-standard.css?v=1">
<link rel="stylesheet" href="./assets/ss-common-header.css?v=20261122-four-controls">
<link rel="stylesheet" href="../assets/els-header-controls.css?v=1">
<link rel="stylesheet" href="./assets/ss-formula-standard.css?v=3">
<link rel="stylesheet" href="./assets/ss-applications-math.css?v=3">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.25/dist/katex.min.css">
<link rel="stylesheet" href="./assets/ss-four-step-standard.css?v=1">
<link rel="stylesheet" href="./assets/ss-fft-lab-standard.css?v=1">
<link rel="stylesheet" href="./assets/ss-chirp-stft.css?v=1">
<link rel="stylesheet" href="./assets/ss-responsive-unified.css?v=1">
<link rel="stylesheet" href="./assets/ss-plot-typography.css?v=1">
<link rel="stylesheet" href="./assets/ss-presentation-mode.css?v=1">
</head>
<body>
<header class="ss-common-header" aria-label="Engineering Learning Studio navigation">
 <a class="ss-common-home" href="../">← Studio</a>
 <details class="ss-common-menu"><summary class="ss-common-title">Signals &amp; Systems · Applications <span aria-hidden="true">⌄</span></summary><nav class="ss-common-links" aria-label="Choose chapter"></nav></details>
 <div class="ss-common-actions">
  <label class="ss-common-language" for="stft-language"><span class="ss-language-icon" aria-hidden="true">🌐</span><select class="ss-common-language-select" id="stft-language" aria-label="Language"><option value="mixed">한/영</option><option value="en">English</option><option value="ko">한국어</option></select></label>
  <label class="ss-common-theme"><select data-els-theme-picker aria-label="Theme"><option value="white-clean">White Clean</option><option value="warm-neutral">Warm Neutral</option><option value="warm-dark">Warm Dark</option><option value="navy-dark">Navy Dark</option><option value="neutral-dark">Neutral Dark</option></select></label>
 </div>
</header>
<main class="ss-stft-root" id="stft-main">
 <section class="ss-stft-intro">
  <p class="ss-stft-eyebrow">PART C · TIME–FREQUENCY ANALYSIS</p>
  <h1 id="stft-title"></h1><p id="stft-intro"></p>
  <nav class="ss-stft-stages" aria-label="Four-step learning sequence">
   <a href="#stft-signal" id="stft-step-1"></a><a href="#stft-full" id="stft-step-2"></a><a href="#stft-window" id="stft-step-3"></a><a href="#stft-map" id="stft-step-4"></a>
  </nav>
 </section>
 <div class="ss-stft-layout">
  <aside class="ss-stft-controls" aria-labelledby="stft-controls-title">
   <h2 id="stft-controls-title"></h2>
   <p class="ss-stft-note" id="stft-controls-help"></p>
   <label><span id="stft-fs-label">Sampling rate</span><select id="stft-fs"><option value="256">256 Hz</option><option value="512" selected>512 Hz</option><option value="1024">1024 Hz</option></select></label>
   <label><span id="stft-duration-label">Duration</span><select id="stft-duration"><option value="1">1 s</option><option value="2" selected>2 s</option><option value="4">4 s</option></select></label>
   <label><span id="stft-start-label">Start frequency</span><input id="stft-start" type="range" min="10" max="100" step="5" value="20"><output id="stft-start-value"></output></label>
   <label><span id="stft-end-label">End frequency</span><input id="stft-end" type="range" min="80" max="240" step="5" value="180"><output id="stft-end-value"></output></label>
   <label><span id="stft-window-label">Window length</span><select id="stft-window"><option value="32">32</option><option value="64">64</option><option value="128" selected>128</option><option value="256">256</option></select></label>
   <label><span id="stft-overlap-label">Overlap</span><select id="stft-overlap"><option value="0">0%</option><option value="50">50%</option><option value="75" selected>75%</option></select></label>
   <label><span id="stft-window-type-label">Window function</span><select id="stft-window-type"><option value="hann" selected>Hann</option><option value="rect">Rectangular</option></select></label>
   <label><span id="stft-fft-factor-label">FFT length</span><select id="stft-fft-factor"><option value="1" selected>M = L</option><option value="2">M = 2L</option></select></label>
   <label><span id="stft-frame-label">Moving window · frame</span><input id="stft-frame" type="range" min="0" max="1" step="1" value="0"><output id="stft-frame-value"></output></label>
   <div class="ss-stft-frame-actions"><button id="stft-prev" type="button"></button><button id="stft-next" type="button"></button></div>
   <button id="stft-reset" type="button" class="ss-stft-reset"></button>
  </aside>
  <div class="ss-stft-content">
   <div class="ss-stft-stats" id="stft-stats" aria-live="polite"></div>
   <section class="ss-stft-card" id="stft-signal"><h2 id="stft-time-title"></h2><p id="stft-time-help"></p><svg id="stft-time-plot" viewBox="0 0 900 225" role="img" aria-label="Chirp waveform with highlighted STFT analysis window"></svg></section>
   <div class="ss-stft-pair">
    <section class="ss-stft-card" id="stft-full"><h2 id="stft-global-title"></h2><p id="stft-global-help"></p><svg id="stft-global-plot" viewBox="0 0 580 260" role="img" aria-label="Full-record FFT magnitude spectrum"></svg></section>
    <section class="ss-stft-card" id="stft-window"><h2 id="stft-local-title"></h2><p id="stft-local-help"></p><svg id="stft-local-plot" viewBox="0 0 580 260" role="img" aria-label="Windowed short-time FFT magnitude spectrum"></svg></section>
   </div>
   <section class="ss-stft-card" id="stft-map"><h2 id="stft-map-title"></h2><p id="stft-map-help"></p><svg id="stft-spectrogram" viewBox="0 0 900 325" role="img" aria-label="Computed STFT magnitude spectrogram over time and frequency"></svg><div class="ss-stft-colorbar"><span id="stft-low-db">−60 dB</span><span class="ss-stft-gradient"></span><span id="stft-high-db">0 dB</span></div><p id="stft-map-note"></p></section>
   <section class="ss-stft-card"><h2 id="stft-insight-title"></h2><div class="ss-stft-formulas">
    <div><small id="stft-eq1-label"></small><div data-ss-math="f(t)=f_0+\frac{f_1-f_0}{T}t" data-ss-math-display="block"></div></div>
    <div><small id="stft-eq2-label"></small><div data-ss-math="X(m,k)=\sum_{r=0}^{L-1}x[r+mH]w[r]e^{-j2\pi kr/M}" data-ss-math-display="block"></div></div>
    <div><small id="stft-eq3-label"></small><div data-ss-math="T_w=\frac{L}{f_s},\quad \Delta f_{\rm bin}=\frac{f_s}{L},\quad \Delta t=\frac{H}{f_s}" data-ss-math-display="block"></div></div>
    <div><small id="stft-eq4-label"></small><div data-ss-math="S(m,k)=\lvert X(m,k)\rvert^2" data-ss-math-display="block"></div></div>
   </div><p id="stft-insight-body"></p></section>
   <section class="ss-stft-card ss-stft-mission"><h2 id="stft-mission-title"></h2><p id="stft-mission-prompt"></p><button type="button" id="stft-mission-check"></button><p id="stft-mission-feedback" role="status" aria-live="polite"></p></section>
   <nav class="ss-stft-links"><a href="./applications-fft-resolution.html" id="stft-prev-link"></a><a href="./applications.html#part-c" id="stft-catalog-link"></a></nav>
  </div>
 </div>
</main>

<script src="../assets/els-theme-v2.js?v=6" defer></script>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.25/dist/katex.min.js" defer></script>
<script src="./assets/ss-math-core.js?v=1" defer></script>
<script src="./assets/ss-applications-math.js?v=5" defer></script>
<script src="./assets/ss-app-chirp-stft.js?v=1" defer></script>
<script src="../assets/els-header-controls.js?v=1" defer></script>
<script src="./assets/ss-presentation-mode.js?v=1" defer></script>
</body></html>
