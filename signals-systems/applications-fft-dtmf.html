<header class="ss-common-header" aria-label="Engineering Learning Studio navigation">
<a class="ss-common-home" href="../">← Studio</a>
<details class="ss-common-menu"><summary class="ss-common-title">Signals &amp; Systems · Applications <span aria-hidden="true">⌄</span></summary><nav class="ss-common-links" aria-label="Choose chapter"></nav></details>
<div class="ss-common-actions"><label class="ss-common-language" for="dtmf-language">🌐 <select class="ss-common-language-select" id="dtmf-language" aria-label="Language"><option value="mixed">한/영</option><option value="en">English</option><option value="ko">한국어</option></select></label><label class="ss-common-theme"><select data-els-theme-picker aria-label="Theme"><option value="white-clean">White Clean</option><option value="warm-neutral">Warm Neutral</option><option value="warm-dark">Warm Dark</option><option value="navy-dark">Navy Dark</option><option value="neutral-dark">Neutral Dark</option></select></label></div></header>
<main id="dtmf-main" class="ss-dtmf-root">
<section class="ss-dtmf-panel ss-dtmf-intro">
 <p class="ss-dtmf-eyebrow">PART C · FFT DISCOVERY SERIES · DECODE</p>
 <h1 id="dtmf-title"></h1><p id="dtmf-intro"></p>
 </section>
<div class="ss-dtmf-layout">
 <aside class="ss-dtmf-panel ss-dtmf-controls" id="dtmf-mystery">
  <h2 id="dtmf-mystery-title"></h2>
  <p id="dtmf-mystery-help"></p>
  <div class="ss-dtmf-challenge"><label for="dtmf-mode" id="dtmf-mode-label"></label><select id="dtmf-mode"><option value="single">One hidden key</option><option value="sequence">Three hidden keys</option></select></div>
  <div class="ss-dtmf-challenge"><span id="dtmf-challenge-label"></span><strong id="dtmf-challenge-index">1 / 1</strong></div>
  <button id="dtmf-play" type="button" class="ss-dtmf-primary"></button>
  <button id="dtmf-new" type="button"></button>
  <output id="dtmf-audio-status" role="status" aria-live="polite"></output>
  <div class="ss-dtmf-control-group">
   <label for="dtmf-fft-n" id="dtmf-n-label"></label>
   <select id="dtmf-fft-n"><option value="256">N = 256</option><option value="512">N = 512</option><option value="1024">N = 1024</option><option value="2048" selected>N = 2048</option></select>
   <label for="dtmf-window" id="dtmf-window-label"></label>
   <select id="dtmf-window"><option value="hann" selected>Hann</option><option value="rect">Rectangular</option></select>
   <label for="dtmf-start" id="dtmf-start-label"></label>
   <input type="range" id="dtmf-start" min="0" max="100" value="40" step="1">
   <output id="dtmf-start-value"></output>
  </div>
  <button id="dtmf-fft" type="button" class="ss-dtmf-primary"></button>
  <p id="dtmf-sampling-note" class="ss-dtmf-small"></p>
 </aside>
 <div class="ss-dtmf-content">
  <section class="ss-dtmf-panel" id="dtmf-time-panel">
   <h2 id="dtmf-wave-title"></h2><p id="dtmf-wave-help"></p>
   <svg id="dtmf-wave" viewBox="0 0 850 200" role="img" aria-label="Time-domain DTMF mystery audio waveform with FFT observation window"></svg>
  </section>
  <section class="ss-dtmf-panel" id="dtmf-spectrum-panel">
   <h2 id="dtmf-spectrum-title"></h2><p id="dtmf-spectrum-help"></p>
   <div id="dtmf-spectrum-placeholder" class="ss-dtmf-placeholder"></div>
   <svg id="dtmf-spectrum" viewBox="0 0 850 290" role="img" aria-label="FFT spectrum with two DTMF frequency peaks" hidden></svg>
   <div id="dtmf-peaks" class="ss-dtmf-peaks" hidden></div>
   <p id="dtmf-bin-note" class="ss-dtmf-small"></p>
  </section>
  <section class="ss-dtmf-panel" id="dtmf-decode">
   <h2 id="dtmf-decode-title"></h2><p id="dtmf-decode-help"></p>
   <div class="ss-dtmf-frequency-map" id="dtmf-frequency-map"></div>
   <p id="dtmf-guess-label"></p>
   <div class="ss-dtmf-keypad" id="dtmf-keypad" role="group" aria-label="Guess a telephone keypad digit"></div>
   <div class="ss-dtmf-guess-actions"><div id="dtmf-current-guess" aria-live="polite">—</div><button id="dtmf-check" type="button" disabled></button><button id="dtmf-next" type="button" hidden></button></div>
   <p id="dtmf-feedback" role="status" aria-live="polite"></p>
   <div id="dtmf-progress" class="ss-dtmf-progress"></div>
  </section>
  <section class="ss-dtmf-panel" id="dtmf-explain-panel">
   <h2 id="dtmf-explain-title"></h2><p id="dtmf-explain"></p>
   <div class="ss-dtmf-formulas"><div data-ss-math="x[n]=A\sin(2\pi f_L n/f_s)+B\sin(2\pi f_H n/f_s)" data-ss-math-display="block"></div><div data-ss-math="f_k=\frac{k f_s}{N},\qquad\Delta f=\frac{f_s}{N}" data-ss-math-display="block"></div></div>
   <p id="dtmf-challenge-conclusion"></p>
  </section>
  </div>
</div></main>
