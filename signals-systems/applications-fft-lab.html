<main id="ss-fft-root" class="ss-fft-root">
 <section class="ss-fft-intro">

   <div class="ss-fft-eyebrow"><a href="./applications.html#part-c">APPLICATIONS / PART C · FFT FOUNDATIONS</a></div>

 </section>
 <section class="ss-fft-roadmap" id="fft-roadmap" aria-label="Four learning stages"></section>
 <section class="ss-fft-workspace">
  <aside class="ss-fft-controls" aria-labelledby="fft-controls-title">
   <h2 id="fft-controls-title"></h2>
   <p class="ss-fft-muted" id="fft-controls-note"></p>
   <label class="ss-fft-field" for="fft-preset"><span id="fft-preset-label"></span>
    <select id="fft-preset">
     <option value="one">1 · One coherent sinusoid (N=16)</option>
     <option value="two">2 · Two sinusoids (N=32)</option>
     <option value="leak">3 · Non-bin-centered sinusoid (N=32)</option>
     <option value="pulse">4 · Single impulse (N=16)</option>
     <option value="custom">Custom samples</option>
    </select>
   </label>
   <label class="ss-fft-field" for="fft-samples"><span id="fft-samples-label"></span>
    <textarea id="fft-samples" spellcheck="false" rows="7" aria-describedby="fft-format"></textarea>
   </label>
   <p id="fft-format" class="ss-fft-hint"></p>
   <label class="ss-fft-check"><input type="checkbox" id="fft-known"><span id="fft-known-label"></span></label>
   <label class="ss-fft-field" for="fft-fs"><span id="fft-fs-label"></span>
    <input id="fft-fs" type="number" min="0.001" max="1000000" step="any" value="8000" disabled>
   </label>
   <div class="ss-fft-buttons"><button type="button" id="fft-run" class="primary"></button><button type="button" id="fft-reset"></button></div>
   <div class="ss-fft-alert" id="fft-error" role="alert" hidden></div>
   <p id="fft-sample-source" class="ss-fft-hint"></p>
  </aside>
  <div class="ss-fft-results">
   <section class="ss-fft-card ss-fft-theory" aria-labelledby="fft-theory-title">
    <h2 id="fft-theory-title"></h2>
    <p id="fft-theory-desc"></p>
    <div class="ss-fft-math-grid">
     <div><div class="ss-fft-equation-label" id="fft-equation-1-label">DFT coefficients</div><div data-ss-math="X[k]=\sum_{n=0}^{N-1}x[n]e^{-j2\pi kn/N}" data-ss-math-display="block" data-ss-math-fallback="X[k] = sum x[n] exp(-j2πkn/N)" class="ss-fft-equation"></div></div>
     <div><div class="ss-fft-equation-label" id="fft-equation-2-label">Frequency interpretation</div><div data-ss-math="\nu_k=\frac{k}{N}\ \text{cycles/sample},\quad f_k=\frac{k f_s}{N}\ \text{Hz}" data-ss-math-display="block" data-ss-math-fallback="νk = k/N cycles/sample; fk = k fs/N Hz" class="ss-fft-equation"></div></div>
    </div>
   </section>
   <section class="ss-fft-metrics" id="fft-metrics" aria-label="FFT analysis metrics"></section>
   <div class="ss-fft-graphs" id="fft-graphs">
    <section class="ss-fft-card ss-fft-graph-card" aria-labelledby="fft-time-title"><h2 id="fft-time-title"></h2><svg id="fft-time-plot" class="ss-fft-svg" viewBox="0 0 620 300" role="img" aria-label="Sample values by sample index"></svg><p id="fft-time-note" class="ss-fft-muted"></p></section>
    <section class="ss-fft-card ss-fft-graph-card" aria-labelledby="fft-spectrum-title"><h2 id="fft-spectrum-title"></h2><svg id="fft-spectrum-plot" class="ss-fft-svg" viewBox="0 0 620 300" role="img" aria-label="One sided FFT amplitude spectrum"></svg><p id="fft-spectrum-note" class="ss-fft-muted"></p></section>
   </div>
   <section class="ss-fft-card ss-fft-interpret" aria-labelledby="fft-insight-title">
    <h2 id="fft-insight-title"></h2>
    <div id="fft-insight"></div>
    <div class="ss-fft-compare" id="fft-compare"></div>
   </section>
   <section class="ss-fft-card" aria-labelledby="fft-table-title"><h2 id="fft-table-title"></h2><p id="fft-table-note" class="ss-fft-muted"></p><div class="ss-fft-table-scroll"><table id="fft-table"><thead></thead><tbody></tbody></table></div></section>
