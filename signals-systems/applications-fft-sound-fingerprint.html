<body><header class="ss-common-header" aria-label="Engineering Learning Studio navigation">
<a class="ss-common-home" href="../">← Studio</a><details class="ss-common-menu"><summary class="ss-common-title">Signals &amp; Systems · Applications <span aria-hidden="true">⌄</span></summary><nav class="ss-common-links" aria-label="Choose chapter"></nav></details>
<div class="ss-common-actions"><label class="ss-common-language" for="finger-language">🌐 <select class="ss-common-language-select" id="finger-language" aria-label="Language"><option value="mixed">한/영</option><option value="en">English</option><option value="ko">한국어</option></select></label><label class="ss-common-theme"><select data-els-theme-picker aria-label="Theme"><option value="white-clean">White Clean</option><option value="warm-neutral">Warm Neutral</option><option value="warm-dark">Warm Dark</option><option value="navy-dark">Navy Dark</option><option value="neutral-dark">Neutral Dark</option></select></label></div></header>
<main class="ss-finger-root" id="finger-main">
<section class="ss-finger-card ss-finger-intro">
 <p class="ss-finger-eyebrow">PART C · FFT DISCOVERY SERIES · DISCOVER</p><h1 id="finger-title"></h1><p id="finger-intro"></p>
 </section>
<div class="ss-finger-layout">
<aside class="ss-finger-card ss-finger-controls">
<h2 id="finger-controls-title"></h2>
<label><span id="finger-note-label"></span><select id="finger-note"><option value="110">A2 · 110 Hz</option><option value="220" selected>A3 · 220 Hz</option><option value="330">E4 · 330 Hz</option></select></label>
<label><span id="finger-length-label"></span><select id="finger-fft-length"><option value="2048">N = 2048</option><option value="4096" selected>N = 4096</option><option value="8192">N = 8192</option></select></label>
<label><span id="finger-window-label"></span><select id="finger-window"><option value="hann" selected>Hann</option><option value="rect">Rectangular</option></select></label>
<label><span id="finger-position-label"></span><input type="range" id="finger-position" min="0" max="100" value="20" step="1"><output id="finger-position-value"></output></label>
<p class="ss-finger-small" id="finger-controls-help"></p>
<button type="button" id="finger-reset"></button>
<details class="ss-finger-real"><summary id="finger-recordings-title"></summary><p id="finger-recordings-help"></p>
<label><span id="finger-piano-file-label"></span><input id="finger-piano-file" type="file" accept="audio/*,.wav,.mp3,.ogg,.m4a,.flac"></label>
<label><span id="finger-guitar-file-label"></span><input id="finger-guitar-file" type="file" accept="audio/*,.wav,.mp3,.ogg,.m4a,.flac"></label>
<label><span id="finger-voice-file-label"></span><input id="finger-voice-file" type="file" accept="audio/*,.wav,.mp3,.ogg,.m4a,.flac"></label>
<button type="button" id="finger-clear-files"></button><p id="finger-files-status" role="status"></p>
</details>
</aside>
<div class="ss-finger-content">
<section class="ss-finger-card" id="finger-predict">
<h2 id="finger-predict-title"></h2><p id="finger-predict-help"></p>
<div class="ss-finger-listen">
 <div><strong>A</strong><button type="button" id="finger-play-a"></button></div>
 <div><strong>B</strong><button type="button" id="finger-play-b"></button></div>
 <div><strong>C</strong><button type="button" id="finger-play-c"></button></div>
</div>
<div class="ss-finger-prediction"><label for="finger-guess" id="finger-guess-label"></label><select id="finger-guess"><option value="">—</option><option value="piano">Piano-like</option><option value="guitar">Guitar-like</option><option value="voice">Voice-like</option></select>
<button type="button" id="finger-guess-check"></button></div>
<p id="finger-guess-feedback" role="status" aria-live="polite"></p>
<p id="finger-synthesis-note" class="ss-finger-small"></p>
</section>
<section class="ss-finger-card" id="finger-observe">
<h2 id="finger-observe-title"></h2><p id="finger-observe-help"></p>
<div class="ss-finger-sample-grid"><div><h3 id="finger-wave-title"></h3><svg id="finger-wave" viewBox="0 0 780 200" role="img" aria-label="Waveform for selected sound"></svg></div>
<div><h3 id="finger-spectrum-title"></h3><svg id="finger-spectrum" viewBox="0 0 780 235" role="img" aria-label="Computed single-sided FFT with harmonic markers"></svg></div></div>
<div class="ss-finger-data" id="finger-data"></div>
</section>
<section class="ss-finger-card" id="finger-reveal">
<h2 id="finger-reveal-title"></h2><p id="finger-reveal-help"></p>
<div class="ss-c-reason" id="finger-evidence-stage">
 <h3 id="finger-evidence-title">Use the FFT peak as evidence</h3>
 <label for="finger-evidence-choice" id="finger-evidence-label">Which harmonic range contains the largest peak of your selected sound?</label>
 <select id="finger-evidence-choice"><option value="">Choose a range</option><option value="h1">Fundamental h = 1</option><option value="h23">Harmonics h = 2–3</option><option value="h4">Higher harmonics h ≥ 4</option></select>
 <button type="button" id="finger-evidence-check">Verify FFT observation</button>
 <p id="finger-evidence-feedback" class="ss-c-reason-feedback" role="status" aria-live="polite"></p>
</div>
<button id="finger-reveal-btn" type="button" class="ss-finger-primary"></button>
<div id="finger-reveal-content" hidden>
<div class="ss-finger-compare" id="finger-compare"></div>
<div class="ss-finger-harmonic-table" id="finger-harmonic-table"></div>
<p id="finger-compare-note"></p>
</div>
</section>
<section class="ss-finger-card" id="finger-conclude">
<h2 id="finger-conclude-title"></h2>
<div class="ss-finger-math"><div data-ss-math="x(t)=\\sum_{h=1}^{H}A_h(t)\\sin(2\\pi h f_0t+\\phi_h)" data-ss-math-display="block"></div><div data-ss-math="f_h=h f_0,\\qquad\\Delta f=\\frac{f_s}{N}" data-ss-math-display="block"></div></div>
<p id="finger-conclude-explain"></p><p id="finger-question"></p>
<label><span id="finger-quiz-label"></span><select id="finger-quiz"><option value="">—</option><option value="pitch"></option><option value="harmonics"></option><option value="volume"></option></select></label>
<button type="button" id="finger-quiz-check"></button><p id="finger-quiz-feedback" role="status"></p>
</section>
</div></div>
</main>
