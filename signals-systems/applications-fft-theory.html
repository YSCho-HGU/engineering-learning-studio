<body>

<header class="fft-guide-header">

<main class="fft-guide-main">

  <h1 id="guide-title">FFT Concept Guide</h1>

    <text id="guide-diagram-left" x="26" y="33" fill="currentColor" font-size="17" font-weight="bold">x[n] · samples</text>
    <text id="guide-diagram-right" x="418" y="33" fill="currentColor" font-size="17" font-weight="bold">X[k] · FFT bins</text>
    <line x1="34" y1="132" x2="299" y2="132" stroke="currentColor" stroke-opacity=".5"/>

     <line x1="574" y1="132" x2="574" y2="113"/><line x1="605" y1="132" x2="605" y2="65"/>
     <line x1="636" y1="132" x2="636" y2="118"/><line x1="667" y1="132" x2="667" y2="100"/>

   </svg>

 </section>

   <label><span id="guide-fs-label"></span><input type="number" id="guide-fs" value="8000" min="1" max="1000000" step="1" disabled></label>
  </div>
  <div class="fft-guide-mini-output">

   <div id="guide-explorer-tex" class="fft-guide-equation"></div>
  </div>
 </section>

 </nav>

<script>
(function(){var select=document.getElementById("guide-lang");if(!select)return;
 document.addEventListener("DOMContentLoaded",function(){
  var lang=window.ELSLanguage;
  if(lang){select.value=lang.get();select.addEventListener("change",function(){lang.set(select.value)});lang.subscribe(function(mode){select.value=mode})}
  document.getElementById("guide-close").addEventListener("click",function(){
   if(window.opener&&!window.opener.closed)window.close();
   else window.location.href="./applications.html";
  });
 });
})();
</script>
