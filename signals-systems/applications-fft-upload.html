<div class="ss-fft-upload-layout">
<aside class="ss-fft-upload-panel ss-fft-upload-controls">
<h2 id="fft-upload-controls-title"></h2>
<label><span id="fft-upload-file-label"></span><input type="file" id="fft-upload-file" accept=".wav,.mp3,.ogg,.m4a,.aac,.flac,.csv,.txt,audio/*,text/csv,text/plain"></label>
<p id="fft-upload-file-help" class="ss-fft-upload-help"></p>

<div class="ss-fft-upload-meta" id="fft-upload-meta"></div>

<p class="ss-fft-upload-help" id="fft-upload-fs-help"></p>
<label><span id="fft-upload-n-label"></span><select id="fft-upload-n"><option value="256">256</option><option value="512">512</option><option value="1024" selected>1024</option><option value="2048">2048</option><option value="4096">4096</option><option value="8192">8192</option></select></label>

   </label>
 </div>
